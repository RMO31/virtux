<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtux - تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#060810;--bg2:#0c0f1a;--bg3:#111525;
      --border:rgba(99,102,241,0.18);--border2:rgba(99,102,241,0.35);
      --accent:#6366f1;--accent2:#818cf8;--accent3:#c084fc;
      --gold:#f59e0b;--red:#ef4444;--green:#22c55e;
      --text:#e2e8f0;--text2:#94a3b8;--text3:#475569;
      --card:rgba(12,15,26,0.9);--glow:0 0 32px rgba(99,102,241,0.28);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:'Tajawal',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      position:relative;
      overflow:hidden;
    }
    body::before{
      content:'';position:fixed;inset:0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%,rgba(99,102,241,0.12) 0%,transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%,rgba(192,132,252,0.08) 0%,transparent 50%);
      pointer-events:none;z-index:0;
    }
    body::after{
      content:'';position:fixed;inset:0;
      background-image:
        linear-gradient(rgba(99,102,241,0.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(99,102,241,0.04) 1px,transparent 1px);
      background-size:44px 44px;
      pointer-events:none;z-index:0;
    }

    /* NAV */
    nav{
      position:relative;z-index:10;
      background:rgba(6,8,16,0.94);
      backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
      padding:0 24px;height:60px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .logo{
      font-family:'Orbitron',monospace;font-size:20px;font-weight:900;
      background:linear-gradient(135deg,var(--accent2),var(--accent3));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      letter-spacing:3px;text-decoration:none;
    }
    .nav-back{
      display:flex;align-items:center;gap:6px;
      padding:6px 14px;border-radius:8px;
      background:rgba(99,102,241,0.08);
      border:1px solid var(--border2);
      color:var(--accent2);text-decoration:none;
      font-size:13px;transition:all 0.2s;
    }
    .nav-back:hover{background:rgba(99,102,241,0.18);color:var(--text);}

    /* CONTAINER */
    .container{
      flex:1;display:flex;align-items:center;justify-content:center;
      padding:40px 20px;position:relative;z-index:1;
    }

    /* AUTH BOX */
    .auth-box{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:20px;
      padding:36px 32px 30px;
      width:100%;max-width:460px;
      backdrop-filter:blur(20px);
      box-shadow:0 24px 80px rgba(0,0,0,0.5),var(--glow);
      position:relative;overflow:hidden;
    }
    .auth-box::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(99,102,241,0.06),transparent 40%),
        linear-gradient(315deg,rgba(192,132,252,0.05),transparent 40%);
      pointer-events:none;
    }
    .auth-box > *{position:relative;z-index:1;}

    .auth-logo{
      text-align:center;margin-bottom:6px;
      font-family:'Orbitron',monospace;font-size:28px;font-weight:900;
      background:linear-gradient(135deg,var(--accent2),var(--accent3));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      letter-spacing:4px;
    }
    .auth-sub{
      text-align:center;color:var(--text2);font-size:13.5px;margin-bottom:26px;
    }

    /* TABS */
    .tabs{
      display:flex;gap:4px;
      background:rgba(6,8,16,0.6);
      border:1px solid var(--border);
      border-radius:10px;padding:4px;
      margin-bottom:24px;
    }
    .tab{
      flex:1;padding:10px;text-align:center;
      font-size:14px;font-weight:700;
      cursor:pointer;background:transparent;
      color:var(--text2);border:none;border-radius:7px;
      font-family:'Tajawal',sans-serif;transition:all 0.2s;
    }
    .tab.active{
      background:rgba(99,102,241,0.2);
      color:var(--accent2);
      border:1px solid var(--border2);
    }
    .tab:hover:not(.active){background:rgba(99,102,241,0.08);color:var(--text);}

    /* FORM */
    .form-panel{display:none;}
    .form-panel.active{display:block;}

    .form-group{margin-bottom:14px;}
    .form-group label{
      display:block;font-size:11px;font-weight:700;
      color:var(--accent2);margin-bottom:6px;
      text-transform:uppercase;letter-spacing:1px;
    }
    .form-group input{
      width:100%;padding:12px 14px;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--bg3);
      color:var(--text);
      font-size:14px;font-family:'Tajawal',sans-serif;
      outline:none;transition:all 0.2s;direction:rtl;
    }
    .form-group input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(99,102,241,0.1);
      background:rgba(17,21,37,0.9);
    }
    .form-group input::placeholder{color:var(--text3);}

    /* GOOGLE BTN */
    .btn-google{
      display:flex;align-items:center;justify-content:center;gap:10px;
      width:100%;padding:12px;border-radius:10px;
      background:#fff;color:#333;border:none;cursor:pointer;
      font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;
      transition:all 0.2s;margin-bottom:14px;
    }
    .btn-google:hover{background:#f1f5f9;transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,0.15);}
    .btn-google svg{width:18px;height:18px;flex-shrink:0;}

    .divider-or{
      text-align:center;color:var(--text3);font-size:12px;
      margin:14px 0;position:relative;
    }
    .divider-or::before,.divider-or::after{
      content:'';position:absolute;top:50%;
      width:42%;height:1px;background:var(--border);
    }
    .divider-or::before{right:0;}
    .divider-or::after{left:0;}

    /* SUBMIT BTN */
    .btn-auth{
      width:100%;padding:13px;
      background:linear-gradient(135deg,var(--accent),var(--accent3));
      color:#fff;border:none;border-radius:10px;
      font-size:15px;font-weight:800;cursor:pointer;
      font-family:'Tajawal',sans-serif;margin-top:6px;
      transition:all 0.2s;
      box-shadow:0 14px 30px rgba(99,102,241,0.25);
    }
    .btn-auth:hover{transform:translateY(-1px);box-shadow:0 18px 38px rgba(99,102,241,0.35);}
    .btn-auth:disabled{background:var(--bg3);color:var(--text3);cursor:not-allowed;box-shadow:none;}

    /* MSG */
    .msg{
      padding:11px 14px;border-radius:10px;
      font-size:13px;margin-bottom:14px;display:none;
    }
    .msg.ok{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#4ade80;}
    .msg.err{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171;}

    .auth-meta{
      display:flex;align-items:center;justify-content:space-between;
      gap:12px;margin-top:14px;color:var(--text3);font-size:12px;
    }
    .auth-meta a{color:var(--accent2);text-decoration:none;}
    .auth-meta a:hover{text-decoration:underline;}

    /* FLOATING ORBS */
    .orb{
      position:fixed;border-radius:50%;
      pointer-events:none;z-index:0;filter:blur(80px);opacity:0.15;
    }
    .orb1{width:400px;height:400px;background:var(--accent);top:-100px;left:-100px;}
    .orb2{width:300px;height:300px;background:var(--accent3);bottom:-80px;right:-80px;}

    @media(max-width:480px){
      .auth-box{padding:26px 18px 22px;border-radius:16px;}
      .auth-logo{font-size:22px;}
    }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <nav>
    <a href="index.html" class="logo">VIRTUX</a>
    <a href="index.html" class="nav-back">← العودة للموقع</a>
  </nav>

  <div class="container">
    <div class="auth-box">
      <div class="auth-logo">VIRTUX</div>
      <div class="auth-sub">مجتمع الألعاب العربي الأول 🎮</div>

      <div class="tabs">
        <button class="tab active" id="tab-login" onclick="switchTab('login')">تسجيل الدخول</button>
        <button class="tab" id="tab-register" onclick="switchTab('register')">إنشاء حساب</button>
      </div>

      <div class="msg" id="authMsg"></div>

      <!-- LOGIN FORM -->
      <div class="form-panel active" id="panel-login">
        <button class="btn-google" onclick="signInWithGoogle()">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          تسجيل الدخول عبر Google
        </button>
        <div class="divider-or">أو</div>
        <div class="form-group">
          <label>البريد الإلكتروني أو اسم المستخدم</label>
          <input type="text" id="login-email" placeholder="example@domain.com أو اسم المستخدم">
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="login-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <div class="auth-meta">
          <span>دخول آمن 🔒</span>
          <a href="javascript:void(0)" onclick="doForgotPassword()">نسيت كلمة المرور؟</a>
        </div>
        <button class="btn-auth" onclick="doLogin()" id="btn-login">🚀 دخول</button>
      </div>

      <!-- REGISTER FORM -->
      <div class="form-panel" id="panel-register">
        <button class="btn-google" onclick="signInWithGoogle()">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          التسجيل عبر Google
        </button>
        <div class="divider-or">أو</div>
        <div class="form-group">
          <label>اسم المستخدم</label>
          <input type="text" id="reg-username" placeholder="GamerPro123">
        </div>
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="reg-email" placeholder="example@domain.com">
        </div>
        <div class="form-group">
          <label>كلمة المرور (6 أحرف على الأقل)</label>
          <input type="password" id="reg-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doRegister()">
        </div>
        <button class="btn-auth" onclick="doRegister()" id="btn-register">🎮 إنشاء حساب</button>
      </div>
    </div>
  </div>

<script>
const SB_URL='https://eyqcpkhjzpmawqtilhgl.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cWNwa2hqenBtYXdxdGlsaGdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzODExMDEsImV4cCI6MjA5MDk1NzEwMX0.HKIrJv4o5wwQWwruYnTNu8aRoMTHYuwpOEMQ5XsDcrk';
const db=window.supabase.createClient(SB_URL,SB_KEY,{
  auth:{persistSession:true,storageKey:'virtux-auth-v2',autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}
});

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.form-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('panel-'+tab).classList.add('active');
  hideMsg();
}
function showMsg(text,type){
  const el=document.getElementById('authMsg');
  el.innerHTML=text;el.className='msg '+type;el.style.display='block';
}
function hideMsg(){document.getElementById('authMsg').style.display='none';}

function getDummyEmail(username){
  if(!username)return'';
  const clean=username.trim().toLowerCase();
  try{
    const encoder=new TextEncoder();
    const bytes=encoder.encode(clean);
    const hex=Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
    return`ux_${hex}@virtux.v`;
  }catch(e){return clean.replace(/[^a-z0-9]/g,'')+`@virtux.v`;}
}

async function doLogin(){
  const identifier=document.getElementById('login-email').value.trim();
  const password=document.getElementById('login-password').value;
  if(!identifier||!password){showMsg('⚠️ أكمل جميع الحقول','err');return;}
  const btn=document.getElementById('btn-login');
  btn.disabled=true;btn.textContent='⏳ جاري الدخول...';
  try{
    let loginError=null;
    if(identifier.includes('@')){
      const{error}=await db.auth.signInWithPassword({email:identifier,password});
      loginError=error;
    }else{
      const normalized=identifier.trim().toLowerCase();
      const{data:p,error:profileErr}=await db.from('profiles').select('email,username').ilike('username',normalized).maybeSingle();
      if(profileErr)throw profileErr;
      if(!p?.email)throw new Error('Ù„Ù… ÙŠÙØ¹Ø«Ø± Ø¹Ù„Ù‰ Ø§Ù„Ø­Ø³Ø§Ø¨.');
      const{error}=await db.auth.signInWithPassword({email:p.email,password});
      loginError=error;
    }
    if(loginError){
      let msg=loginError.message||'فشل تسجيل الدخول';
      if(loginError.status===429)msg='محاولات كثيرة، انتظر قليلاً.';
      else if(loginError.message==='Invalid login credentials'||loginError.status===400)msg='بريد/اسم مستخدم أو كلمة مرور خاطئة.';
      throw new Error(msg);
    }
    showMsg('✅ مرحباً بك! جاري التحويل...','ok');
    setTimeout(()=>window.location.href='index.html',1200);
  }catch(err){
    showMsg('❌ '+( err.message||'فشل'),'err');
    btn.disabled=false;btn.textContent='🚀 دخول';
  }
}

async function doForgotPassword(){
  const email=prompt('أدخل بريدك الإلكتروني:');
  if(!email)return;
  try{
    const{error}=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/index.html'});
    if(error)throw error;
    alert('✅ تم إرسال رابط إعادة التعيين، تحقق من بريدك.');
  }catch(e){alert('❌ خطأ: '+e.message);}
}

async function doRegister(){
  const username=document.getElementById('reg-username').value.trim();
  const email=document.getElementById('reg-email').value.trim();
  const password=document.getElementById('reg-password').value;
  if(!username||!email||!password){showMsg('⚠️ أكمل جميع الحقول','err');return;}
  if(!/^[a-zA-Z0-9_\s\u0600-\u06FF]+$/.test(username)){showMsg('⚠️ اسم المستخدم يحتوي على رموز غير مسموحة','err');return;}
  if(password.length<6){showMsg('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل','err');return;}
  const btn=document.getElementById('btn-register');
  btn.disabled=true;btn.textContent='⏳ جاري الإنشاء...';
  try{
    const{data,error}=await db.auth.signUp({email,password,options:{data:{username},emailRedirectTo:window.location.origin+'/index.html'}});
    if(error){let msg=error.message||'فشل التسجيل';if(msg.includes('rate limit'))msg='تجاوزت الحد، حاول لاحقاً';throw new Error(msg);}
    if(data.user){
      await db.from('profiles').upsert({id:data.user.id,username,email,role:'user',roles:['user'],created_at:new Date().toISOString()});
    }
    if(data.session){
      showMsg('🎉 مرحباً! جاري التحويل...','ok');
      setTimeout(()=>window.location.href='index.html',1200);
    }else{
      showMsg('✅ تم إنشاء حسابك! تحقق من بريدك إذا طُلب منك.','ok');
      btn.disabled=false;btn.textContent='🎮 إنشاء حساب';
      setTimeout(()=>switchTab('login'),2500);
    }
  }catch(e){
    showMsg('❌ '+( e.message||'فشل'),'err');
    btn.disabled=false;btn.textContent='🎮 إنشاء حساب';
  }
}

async function signInWithGoogle(){
  const redirectUrl = window.location.href.split('auth.html')[0] + 'index.html';
  const{error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:redirectUrl}});
  if(error)showMsg('❌ خطأ في Google: '+error.message,'err');
}

db.auth.getSession().then(({data:{session}})=>{
  if(session)window.location.href='index.html';
});
</script>
</body>
</html>
