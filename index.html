<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; frame-src https://www.youtube.com https://player.twitch.tv https://youtube.com;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtux — مجتمع الألعاب</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Poppins',sans-serif;background:#0a0000;color:#fff;min-height:100vh}
    .vx-root{display:flex;flex-direction:column;min-height:100vh}
    .vx-topbar{display:flex;align-items:center;padding:8px 16px;background:#000;border-bottom:1px solid #cc0000;gap:10px;flex-wrap:wrap}
    .vx-logo{font-size:20px;font-weight:700;color:#e01010;letter-spacing:2px}
    .vx-logo span{color:#fff}
    .vx-topnav{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
    .dd{position:relative}
    .dd-btn{background:transparent;border:1px solid #e01010;color:#e01010;padding:4px 12px;border-radius:5px;font-size:12px;cursor:pointer}
    .dd-btn:hover{background:#e01010;color:#000}
    .dd-menu{display:none;position:absolute;top:calc(100% + 4px);right:0;background:#110000;border:1px solid #e01010;border-radius:6px;min-width:160px;z-index:999}
    .dd.open .dd-menu{display:block}
    .dd-menu a{display:block;color:#ccc;padding:8px 14px;font-size:12px;text-decoration:none;border-bottom:1px solid #333}
    .dd-menu a:hover{background:#e01010;color:#000}
    .post-actions{display:flex;gap:10px;align-items:center;margin-left:auto}
    .btn-user-post{background:#e01010;color:#000;border:none;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
    .vx-ticker{background:#000;display:flex;align-items:stretch;overflow:hidden;border-bottom:1px solid #e01010;height:30px}
    .ticker-label{font-size:10px;background:#e01010;color:#000;padding:0 12px;font-weight:700;white-space:nowrap;display:flex;align-items:center}
    .ticker-scroll{flex:1;overflow:hidden;height:30px}
    @keyframes ticker-scroll-anim{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .ticker-track{display:inline-flex;white-space:nowrap;align-items:center;height:30px;animation:ticker-scroll-anim 35s linear infinite}
    .ticker-item{display:inline-flex;align-items:center;padding:0 25px;font-size:12px;color:#99aabb;white-space:nowrap}
    .ticker-item a{color:#e01010;text-decoration:none}
    .vx-body{display:flex;flex:1}
    .vx-sidebar{width:170px;background:linear-gradient(180deg,#110000,#2a2a2a);border-right:1px solid #e01010;display:flex;flex-direction:column;gap:3px;padding:8px 5px}
    .sb-btn{background:transparent;border:none;color:#aab;padding:8px 10px;border-radius:5px;font-size:12px;cursor:pointer;text-align:left}
    .sb-btn:hover,.sb-btn.active{background:#e01010;color:#000}
    .sb-section{font-size:9px;color:#777;text-transform:uppercase;padding:6px 10px 2px}
    .vx-main{flex:1;max-height:calc(100vh - 80px);overflow-y:auto}
    .vx-page{display:none}
    .vx-page.active{display:block}
    .home-hero{background:radial-gradient(circle at 20% 20%, rgba(220,0,0,0.12), transparent 55%), #0a0000;min-height:calc(100vh - 80px);padding:30px 15px}
    .home-welcome{font-size:28px;font-weight:600;color:#e01010;background:rgba(0,0,0,0.5);backdrop-filter:blur(5px);padding:8px 25px;border-radius:40px;border:1px solid #e01010;display:inline-block;margin-bottom:30px}
    .filter-bar{display:flex;gap:6px;padding:8px 15px;flex-wrap:wrap;border-bottom:1px solid #333}
    .filter-btn{background:#222;border:1px solid #444;color:#ddd;border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer}
    .filter-btn.active,.filter-btn:hover{background:#e01010;color:#000}
    .posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;padding:15px}
    .post-card{background:#1e1e2e;border:1px solid #333;border-radius:12px;overflow:hidden;transition:0.2s}
    .post-card:hover{border-color:#e01010}
    .post-card-img{width:100%;max-height:200px;object-fit:cover}
    .post-card-video{width:100%;aspect-ratio:16/9;background:#000;position:relative;cursor:pointer}
    .post-card-body{padding:10px 12px}
    .post-card-title{font-size:13px;font-weight:600;color:#ddd;margin-bottom:4px}
    .post-card-summary{font-size:11px;color:#aaa;margin-bottom:8px}
    .post-card-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px}
    .post-tag{font-size:10px;background:#2a2a3a;color:#e01010;border-radius:4px;padding:2px 6px}
    .edit-post-btn{background:transparent;border:1px solid #ffaa33;color:#ffaa33;border-radius:4px;font-size:10px;padding:2px 6px;cursor:pointer}
    .author-info{display:flex;align-items:center;gap:6px;margin-bottom:6px;cursor:pointer}
    .author-avatar{width:24px;height:24px;border-radius:50%;background:#2a2a3a;display:flex;align-items:center;justify-content:center;font-size:12px;overflow:hidden}
    .author-name{font-size:10px;color:#e01010}
    .channels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:12px}
    .subscriber-card{background:#1e1e2e;border-radius:12px;padding:12px;text-align:center}
    .channel-avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;margin:0 auto 8px}
    .channel-name{font-size:13px;color:#e01010;font-weight:600}
    .pagination{display:flex;justify-content:center;gap:15px;margin:15px 0 25px}
    .pagination button{background:#2a2a3a;border:1px solid #e01010;color:#e01010;padding:4px 12px;border-radius:20px;cursor:pointer}
    .pagination button:disabled{opacity:0.4}
    /* profile modal smaller */
    .profile-modal .modal-box{max-width:450px;width:95%;padding:15px;max-height:85vh;overflow-y:auto}
    .profile-modal .modal-box h2{font-size:18px;margin-bottom:10px}
    .profile-field{margin-bottom:8px}
    .profile-field label{font-size:11px}
    .profile-field input{font-size:12px;padding:5px 8px}
    .profile-buttons button{padding:5px;font-size:11px}
    .change-password-section{margin-top:10px;padding-top:8px}
    /* role badges */
    #user-role-badge{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center}
    #user-role-badge span{font-size:8px;padding:2px 5px;white-space:nowrap}
    .home-channel-panel{margin:20px auto;max-width:1100px}
    .home-split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .hcp-half{background:rgba(0,0,0,0.55);border-radius:12px;overflow:hidden}
    .hcp-half-head{font-size:11px;font-weight:700;color:#e01010;padding:7px 10px;border-bottom:1px solid rgba(220,0,0,0.2)}
    .hc-wrap{position:relative;min-height:180px}
    .hc-track{display:flex;transition:transform 0.3s}
    .hc-slide{min-width:100%;padding:8px 10px 35px}
    .hc-thumb-wrap{position:relative;border-radius:8px;overflow:hidden}
    .hc-thumb{width:100%;aspect-ratio:16/9;object-fit:cover}
    .hc-badge-live{position:absolute;top:5px;right:6px;background:#c00;color:#fff;font-size:8px;padding:2px 6px;border-radius:3px}
    .hc-info-title{font-size:11px;font-weight:600;margin-top:5px}
    .hc-nav{position:absolute;bottom:6px;right:8px;display:flex;gap:6px}
    .hc-dot{width:5px;height:5px;border-radius:50%;background:#444}
    .hc-dot.active{background:#e01010}
    .hc-btn{width:22px;height:22px;border-radius:50%;background:rgba(220,0,0,0.2);border:1px solid #e01010;color:#e01010;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center}
    .modal.active{display:flex}
    .modal-content{background:#110000;border:1px solid #e01010;border-radius:12px;width:90%;max-width:400px;padding:20px}
    .btn-submit{background:#e01010;color:#000;border:none;padding:8px;border-radius:6px;font-weight:bold;cursor:pointer;width:100%}
    .error-msg{color:#f55;font-size:11px;margin-top:5px}
    .upm-box{background:#111;border:1px solid #e01010;border-radius:12px;width:90%;max-width:480px}
    .upm-top{background:#000;padding:10px;display:flex;justify-content:space-between}
    .upm-body{padding:15px}
    #upm-submit{background:#e01010;color:#000;border:none;padding:8px;border-radius:6px;width:100%;font-weight:bold}
    input,textarea{background:#1a0000;border:1px solid #444;color:#fff;border-radius:5px;padding:6px}
  </style>

</head>

<!-- Modals -->
<div id="authModal" class="modal"><div class="modal-content"><span class="modal-close" id="closeModal" style="float:right;cursor:pointer">&times;</span><div id="modal-login"><h3>تسجيل الدخول</h3><input type="text" id="loginIdentifier" placeholder="البريد أو اسم المستخدم" style="width:100%;margin:8px 0"><input type="password" id="loginPassword" placeholder="كلمة المرور" style="width:100%;margin:8px 0"><div id="loginError" class="error-msg"></div><button id="doLoginBtn" class="btn-submit">دخول</button><button id="googleBtn" class="btn-submit" style="background:#4285F4;margin-top:8px">🔵 Google</button><div class="auth-switch">ليس لديك حساب؟ <a id="switchToSignup">إنشاء حساب</a></div></div><div id="modal-signup" style="display:none"><h3>حساب جديد</h3><input type="text" id="signupUsername" placeholder="اسم المستخدم" style="width:100%;margin:8px 0"><input type="email" id="signupEmail" placeholder="البريد" style="width:100%;margin:8px 0"><input type="password" id="signupPassword" placeholder="كلمة المرور" style="width:100%;margin:8px 0"><div id="signupError" class="error-msg"></div><button id="doSignupBtn" class="btn-submit">تسجيل</button><button id="googleSignupBtn" class="btn-submit" style="background:#4285F4;margin-top:8px">🔵 Google</button><div class="auth-switch">لديك حساب؟ <a id="switchToLogin">تسجيل الدخول</a></div></div></div></div>

file-buttons" style="display:flex;gap:8px;margin-top:12px"><button id="saveProfileBtn" class="btn-save" style="background:#e01010">حفظ</button><button id="closeProfileBtn" class="btn-cancel" style="background:#555">إلغاء</button></div><button id="deleteAccountBtn" style="width:100%;background:transparent;border:1px solid #f55;color:#f55;padding:5px;margin-top:10px;border-radius:6px">🗑️ حذف الحساب</button></div></div>

<script>
const SUPABASE_URL = 'https://eyqcpkhjzpmawqtilhgl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cWNwa2hqenBtYXdxdGlsaGdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzODExMDEsImV4cCI6MjA5MDk1NzEwMX0.HKIrJv4o5wwQWwruYnTNu8aRoMTHYuwpOEMQ5XsDcrk';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true } });
window.allPosts = {};
let currentEditPost = null; let ytPage = 1; const YT_PER_PAGE = 40;
window.currentUserId = null; window.userRoles = ['guest']; window._siteLanguage = 'ar';

function t(ar, en) { return window._siteLanguage === 'en' ? en : ar; }
function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

// Auth
async function updateUIAfterAuth(session) {
  const loginLink = document.getElementById('btn-login-link');
  const userArea = document.getElementById('btn-user-area');
  const userNameSpan = document.getElementById('user-name');
  const roleBadge = document.getElementById('user-role-badge');
  const avatarImg = document.getElementById('user-avatar-img');
  if(!loginLink) return;
  if(session?.user) {
    loginLink.style.display = 'none';
    userArea.style.display = 'flex';
    window.currentUserId = session.user.id;
    const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    const roles = profile ? (Array.isArray(profile.roles) ? profile.roles : (profile.role ? [profile.role] : ['user'])) : ['user'];
    window.userRoles = roles;
    window.currentUsername = profile?.username || session.user.user_metadata?.username || session.user.email.split('@')[0];
    userNameSpan.textContent = '👋 ' + window.currentUsername;
    const colorMap = { admin:'#f55', moderator:'#ff2222', youtuber_vip:'#ff6600', youtuber:'#f55', vip:'#e01010', member:'#cc2222', donor:'#00ccff' };
    roleBadge.innerHTML = roles.filter(r=>r!=='user').map(r=> `<span style="background:#1a0000;border:1px solid ${colorMap[r]||'#e01010'};color:${colorMap[r]||'#e01010'};border-radius:12px;padding:2px 6px;font-size:8px;">${r.toUpperCase()}</span>`).join('');
    if(profile?.avatar_url) { avatarImg.src = profile.avatar_url; avatarImg.style.display = 'inline-block'; }
    else avatarImg.style.display = 'none';
    document.querySelectorAll('.btn-user-post').forEach(b=>b.style.display='inline-flex');
  } else {
    loginLink.style.display = 'inline-block';
    userArea.style.display = 'none';
    window.currentUserId = null; window.userRoles = ['guest'];
  }
}
db.auth.onAuthStateChange((e,s)=>updateUIAfterAuth(s));
async function doLogout() { await db.auth.signOut(); location.reload(); }

// Pages
const rooms = ['live','tournaments','highlights','subscribers','gaming-news','youtube-news','yt-channels','yt-videos','projects'];
const roomLabels = { live:'🔴 مباشر', tournaments:'🏆 البطولات', highlights:'🎬 أبرز اللحظات', subscribers:'👥 المشتركون', 'gaming-news':'📰 أخبار الألعاب', 'youtube-news':'▶️ أخبار يوتيوب', 'yt-channels':'📺 قنوات يوتيوب', 'yt-videos':'🎬 فيديوهات يوتيوب', projects:'🌐 التعاون' };
const main = document.querySelector('.vx-main');
rooms.forEach(room => {
  const div = document.createElement('div'); div.className = 'vx-page'; div.id = `page-${room}`;
  const postBtn = (['live','tournaments','highlights','yt-videos','gaming-news','youtube-news'].includes(room)) ? `<div class="post-actions"><button class="btn-user-post" data-room="${room}" onclick="openUserModal('${room}')">➕ نشر</button></div>` : '';
  let filterBar = '';
  if(room === 'live') filterBar = `<div class="filter-bar"><button class="filter-btn active" onclick="filterPosts('live','',this)">الكل</button><button class="filter-btn" onclick="filterPosts('live','مباشر Now',this)">مباشر Now</button><button class="filter-btn" onclick="filterPosts('live','Pre s',this)">Pre s</button><button class="filter-btn" onclick="filterPosts('live','VIP',this)">VIP</button></div>`;
  if(room === 'tournaments') filterBar = `<div class="filter-bar"><button class="filter-btn active" onclick="filterPosts('tournaments','',this)">الكل</button><button class="filter-btn" onclick="filterPosts('tournaments','تسجيل',this)">تسجيل</button><button class="filter-btn" onclick="filterPosts('tournaments','عالمي',this)">عالمي</button><button class="filter-btn" onclick="filterPosts('tournaments','VIP',this)">VIP</button></div>`;
  if(room === 'highlights') filterBar = `<div class="filter-bar"><button class="filter-btn active" onclick="filterPosts('highlights','',this)">الكل</button><button class="filter-btn" onclick="filterPosts('highlights','Pro',this)">Pro</button><button class="filter-btn" onclick="filterPosts('highlights','Video',this)">Video</button><button class="filter-btn" onclick="filterPosts('highlights','Photo',this)">Photo</button></div>`;
  div.innerHTML = `<div class="page-header" style="display:flex;justify-content:space-between;padding:10px 18px"><h2>${roomLabels[room]}</h2>${postBtn}</div>${filterBar}<div class="posts-grid" id="grid-${room}"><div class="loading-state">⏳</div></div>`;
  if(room === 'yt-videos') div.innerHTML += `<div class="pagination" id="yt-pagination"><button id="yt-prev" disabled>◀ السابق</button><span id="yt-page-info">صفحة 1</span><button id="yt-next">التالي ▶</button></div>`;
  main.appendChild(div);
});
const contact = document.createElement('div'); contact.className='vx-page'; contact.id='page-contact'; contact.innerHTML=`<div class="page-header"><h2>📞 التواصل</h2></div><div class="contact-cards" style="display:flex;gap:12px;padding:20px"><div class="contact-card" style="background:#1e1e2e;padding:12px;border-radius:12px"><div>💬</div><div>Discord</div><div class="cc-handle">discord.gg/45fJNmww6D</div></div><div class="contact-card" style="background:#1e1e2e;padding:12px;border-radius:12px"><div>📧</div><div>Email</div><div>menouer.rayane310201@gmail.com</div></div></div>`;
main.appendChild(contact);

async function loadPage(room) {
  const el = document.getElementById(`grid-${room}`); if(!el) return;
  el.innerHTML = '<div class="loading-state">⏳</div>';
  let { data } = await db.from('posts').select('*').eq('room', room).order('id', { ascending: false });
  if(room === 'live' || room === 'yt-videos') {
    const vip = await db.from('posts').select('*').eq('room', room).like('tag', 'auto:%');
    data = [...(vip.data||[]), ...(data||[])];
  }
  window.allPosts[room] = data || [];
  if(room === 'yt-videos') { ytPage = 1; renderYTPage(); }
  else if(room === 'subscribers') renderSubscribers();
  else renderCards(window.allPosts[room], `grid-${room}`, room);
}
function renderYTPage() {
  const all = window.allPosts['yt-videos'] || [];
  const start = (ytPage-1)*YT_PER_PAGE;
  const pagePosts = all.slice(start, start+YT_PER_PAGE);
  renderCards(pagePosts, 'grid-yt-videos', 'yt-videos');
  const totalPages = Math.ceil(all.length / YT_PER_PAGE);
  document.getElementById('yt-page-info').innerText = `صفحة ${ytPage} / ${totalPages||1}`;
  document.getElementById('yt-prev').disabled = ytPage <= 1;
  document.getElementById('yt-next').disabled = ytPage >= totalPages;
}
window.nextYTPage = () => { if(ytPage * YT_PER_PAGE < (window.allPosts['yt-videos']||[]).length) { ytPage++; renderYTPage(); } };
window.prevYTPage = () => { if(ytPage > 1) { ytPage--; renderYTPage(); } };
document.addEventListener('click', e => { if(e.target.id === 'yt-next') nextYTPage(); if(e.target.id === 'yt-prev') prevYTPage(); });

async function renderSubscribers() {
  const el = document.getElementById('grid-subscribers'); if(!el) return;
  const { data: profiles } = await db.from('profiles').select('id,username,avatar_url,roles,role');
  if(!profiles) { el.innerHTML='<div class="empty-state">لا يوجد</div>'; return; }
  const priority = ['admin','moderator','youtuber_vip','youtuber','vip','member','user'];
  const userTop = {};
  profiles.forEach(p => {
    let roles = [];
    if(p.roles) roles = Array.isArray(p.roles) ? p.roles : (typeof p.roles === 'string' ? JSON.parse(p.roles) : []);
    if(!roles.length && p.role) roles = [p.role];
    if(!roles.length) roles = ['user'];
    for(let r of priority) if(roles.includes(r)) { userTop[p.id] = r; break; }
    if(!userTop[p.id]) userTop[p.id] = 'user';
  });
  const groups = {};
  profiles.forEach(p => { const top = userTop[p.id]; if(!groups[top]) groups[top] = []; if(!groups[top].some(x=>x.id===p.id)) groups[top].push(p); });
  const colors = { admin:'#ff0000', moderator:'#ff2222', youtuber_vip:'#ff6600', youtuber:'#cc0000', vip:'#e01010', member:'#cc2222', user:'#888' };
  const names = { admin:'الإدارة', moderator:'المشرفون', youtuber_vip:'YT VIP', youtuber:'يوتيوبرز', vip:'VIP', member:'الأعضاء', user:'المستخدمون' };
  let html = '';
  for(let r of priority) {
    if(groups[r] && groups[r].length) {
      html += `<div style="margin:15px 10px 5px"><h3 style="color:${colors[r]};font-size:13px">${names[r]}</h3><div class="channels-grid">`;
      groups[r].forEach(u => {
        const avatar = u.avatar_url ? `<img class="channel-avatar" src="${u.avatar_url}" style="width:60px;height:60px;">` : `<div class="channel-avatar" style="background:#2a2a3a;display:flex;align-items:center;justify-content:center">👤</div>`;
        html += `<div class="subscriber-card" style="border:1px solid ${colors[r]}33"><div class="channel-avatar" style="margin:0 auto">${avatar}</div><div class="channel-name">${escapeHtml(u.username)}</div><div style="font-size:10px;color:${colors[r]}">${names[r]}</div></div>`;
      });
      html += `</div></div>`;
    }
  }
  el.innerHTML = html || '<div class="empty-state">لا يوجد مشتركون</div>';
}
window.filterSubscribers = (role, btn) => { if(btn) document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active'); renderSubscribers(); };

function renderCards(posts, gridId, room) {
  const el = document.getElementById(gridId); if(!el) return;
  if(!posts.length) { el.innerHTML='<div class="empty-state">لا توجد منشورات</div>'; return; }
  if(room === 'yt-channels') {
    el.innerHTML = `<div class="channels-grid">${posts.map(p => `<div class="channel-card"><div class="channel-avatar">📺</div><div class="channel-name">${escapeHtml(p.title)}</div><div class="channel-sub">${p.description||''}</div><a href="${p.url}" target="_blank" class="channel-link">زيارة</a></div>`).join('')}</div>`;
    return;
  }
  const canViewVIP = window.userRoles.some(r=>['vip','member','admin','moderator','youtuber_vip'].includes(r));
  const profilesMap = {};
  if(room === 'gaming-news' || room === 'youtube-news') {
    const uids = [...new Set(posts.map(p=>p.user_id).filter(Boolean))];
    if(uids.length) db.from('profiles').select('id,username,avatar_url').in('id',uids).then(res=>{ if(res.data) res.data.forEach(pr=>profilesMap[pr.id]=pr); }).catch(()=>{});
  }
  el.innerHTML = posts.map(p => {
    let media = ''; const isRestricted = (p.tag === 'VIP' && !canViewVIP);
    if(isRestricted) media = `<div style="aspect-ratio:16/9;background:#1a0a2e;display:flex;align-items:center;justify-content:center">🔒 VIP</div>`;
    else if(p.url && (p.url.includes('youtube.com')||p.url.includes('youtu.be'))) {
      const vid = p.url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/)?.[1];
      media = `<div class="post-card-video" data-vid="${vid}" onclick="playYT(this)"><img src="https://i.ytimg.com/vi/${vid}/mqdefault.jpg" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><div style="width:40px;height:40px;background:rgba(0,0,0,.6);border-radius:50%;display:flex;align-items:center;justify-content:center"><div style="width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid white"></div></div></div></div>`;
    } else media = `<div class="post-card-emoji" style="height:100px;display:flex;align-items:center;justify-content:center;font-size:40px">${p.icon||'📄'}</div>`;
    const author = profilesMap[p.user_id];
    const authorHtml = (room==='gaming-news'||room==='youtube-news') && author ? `<div class="author-info" onclick="showAuthor('${author.id}','${escapeHtml(author.username)}','${author.avatar_url||''}')"><div class="author-avatar">${author.avatar_url?`<img src="${author.avatar_url}" style="width:100%;height:100%">`:'👤'}</div><div class="author-name">@${escapeHtml(author.username)}</div></div>` : '';
    const isOwner = window.currentUserId && p.user_id === window.currentUserId;
    const editBtn = (isOwner || window.userRoles.includes('admin')) && (room==='gaming-news'||room==='youtube-news') ? `<button class="edit-post-btn" onclick="editPostModal(${JSON.stringify(p).replace(/"/g,'&quot;')},'${room}')">✏️ تعديل</button>` : '';
    const deleteBtn = (isOwner || window.userRoles.includes('admin')) ? `<button onclick="deletePost(${p.id},'${room}')" style="background:transparent;border:1px solid #f55;color:#f55;border-radius:4px;padding:2px 6px;font-size:10px">🗑️</button>` : '';
    return `<div class="post-card">${media}<div class="post-card-body">${authorHtml}<div class="post-card-title">${escapeHtml(p.title)}</div><div class="post-card-summary">${(p.description||'').substring(0,100)}</div><div class="post-card-footer"><span class="post-tag">${p.tag||''}</span><div>${editBtn}${deleteBtn}</div></div></div></div>`;
  }).join('');
}
window.playYT = function(el) { const vid = el.getAttribute('data-vid'); if(!vid) return; el.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1" style="width:100%;height:100%;border:none" allowfullscreen></iframe>`; };
window.filterPosts = (room, tag, btn) => { if(btn) document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active'); const filtered = tag ? (window.allPosts[room]||[]).filter(p=>p.tag===tag) : (window.allPosts[room]||[]); if(room==='yt-videos') { window.allPosts['yt-videos'] = filtered; ytPage=1; renderYTPage(); } else renderCards(filtered, `grid-${room}`, room); };
window.showPage = function(id) { document.querySelectorAll('.vx-page').forEach(p=>p.classList.remove('active')); document.querySelectorAll('.sb-btn').forEach(b=>b.classList.remove('active')); const pg = document.getElementById(`page-${id}`); if(pg) pg.classList.add('active'); const btn = document.getElementById(`sb-${id}`); if(btn) btn.classList.add('active'); if(id !== 'home' && id !== 'contact') loadPage(id); };
window.toggleDD = (id) => { document.querySelectorAll('.dd').forEach(d=>{if(d.id!==id) d.classList.remove('open');}); document.getElementById(id).classList.toggle('open'); };
document.addEventListener('click',e=>{if(!e.target.closest('.dd')) document.querySelectorAll('.dd').forEach(d=>d.classList.remove('open'));});

async function deletePost(id,room) { if(confirm('حذف؟')) { await db.from('posts').delete().eq('id',id); loadPage(room); } }
function openUserModal(room, post=null) { if(!window.currentUserId) { document.getElementById('authModal').classList.add('active'); return; } currentEditPost = post; document.getElementById('upm-room-title').innerText = room; document.getElementById('upm-form-body').innerHTML = `<div><label>العنوان</label><input id="upm-title" style="width:100%;padding:6px"></div><div><label>الوصف</label><input id="upm-desc" style="width:100%;padding:6px"></div><div><label>العلامة</label><input id="upm-tag" style="width:100%;padding:6px"></div><div><label>الرابط</label><input id="upm-url" style="width:100%;padding:6px"></div>`; if(post) { document.getElementById('upm-title').value = post.title||''; document.getElementById('upm-desc').value = post.description||''; document.getElementById('upm-tag').value = post.tag||''; document.getElementById('upm-url').value = post.url||''; } document.getElementById('upm-submit').onclick = async () => { const title = document.getElementById('upm-title').value; const desc = document.getElementById('upm-desc').value; const tag = document.getElementById('upm-tag').value; const url = document.getElementById('upm-url').value; if(!title) return alert('العنوان مطلوب'); const body = { title, description: desc, tag, url, room, user_id: window.currentUserId }; if(currentEditPost) await db.from('posts').update(body).eq('id', currentEditPost.id); else await db.from('posts').insert(body); document.getElementById('upm-modal').style.display='none'; loadPage(room); }; document.getElementById('upm-modal').style.display='flex'; }
window.editPostModal = (post, room) => openUserModal(room, post);
function showAuthor(id, name, avatar) { const modal = document.createElement('div'); modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:10000;display:flex;align-items:center;justify-content:center'; modal.onclick = (e) => { if(e.target===modal) modal.remove(); }; modal.innerHTML = `<div style="background:#110000;border:1px solid #e01010;border-radius:20px;padding:20px;text-align:center;max-width:300px"><div style="width:70px;height:70px;border-radius:50%;margin:0 auto;background:#2a2a3a;display:flex;align-items:center;justify-content:center;font-size:36px">${avatar?`<img src="${avatar}" style="width:100%;border-radius:50%">`:'👤'}</div><h3 style="color:#e01010;margin:10px 0">${escapeHtml(name)}</h3><p style="color:#aaa">@${escapeHtml(name)}</p><button onclick="this.closest('div').parentElement.remove()" style="background:#e01010;color:#000;border:none;padding:5px 15px;border-radius:20px">إغلاق</button></div>`; document.body.appendChild(modal); }
// Home carousel (simplified)
async function loadHomePanel() {
  const liveWrap = document.getElementById('hc-live'); const vidWrap = document.getElementById('hc-videos');
  if(liveWrap) { const {data} = await db.from('posts').select('title,url,tag').eq('room','live').limit(6); if(data) liveWrap.innerHTML = data.map(p=>`<div style="padding:5px">🔴 ${p.title}</div>`).join('')||'لا يوجد'; }
  if(vidWrap) { const {data} = await db.from('posts').select('title,url').eq('room','yt-videos').limit(6); if(data) vidWrap.innerHTML = data.map(p=>`<div style="padding:5px">🎬 ${p.title}</div>`).join('')||'لا يوجد'; }
}
// Auth event handlers
document.getElementById('doLoginBtn').onclick = async () => { const id = document.getElementById('loginIdentifier').value; const pwd = document.getElementById('loginPassword').value; let email = id.includes('@') ? id : null; if(!email) { const {data} = await db.from('profiles').select('email').ilike('username',id).maybeSingle(); email = data?.email || id+'@virtux.v'; } const {error} = await db.auth.signInWithPassword({email, password:pwd}); if(error) alert(error.message); else { document.getElementById('authModal').classList.remove('active'); updateUIAfterAuth((await db.auth.getSession()).data.session); } };
document.getElementById('doSignupBtn').onclick = async () => { const u = document.getElementById('signupUsername').value; const e = document.getElementById('signupEmail').value; const p = document.getElementById('signupPassword').value; const {data,error} = await db.auth.signUp({email:e,password:p,options:{data:{username:u}}}); if(error) alert(error.message); else { await db.from('profiles').upsert({id:data.user.id,username:u,email:e,role:'user'}); alert('تم التسجيل، يمكنك الدخول'); document.getElementById('authModal').classList.remove('active'); } };
document.getElementById('googleBtn').onclick = () => db.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin}});
document.getElementById('switchToSignup').onclick = () => { document.getElementById('modal-login').style.display='none'; document.getElementById('modal-signup').style.display='block'; };
document.getElementById('switchToLogin').onclick = () => { document.getElementById('modal-signup').style.display='none'; document.getElementById('modal-login').style.display='block'; };
document.getElementById('closeModal').onclick = () => document.getElementById('authModal').classList.remove('active');
document.getElementById('btn-login-link').onclick = (e) => { e.preventDefault(); document.getElementById('authModal').classList.add('active'); };
// Profile
document.getElementById('profileButton').onclick = () => document.getElementById('profileModal').style.display='flex';
document.getElementById('closeProfileBtn').onclick = () => document.getElementById('profileModal').style.display='none';
document.getElementById('saveProfileBtn').onclick = async () => { const uname = document.getElementById('profileUsername').value; await db.from('profiles').upsert({id:window.currentUserId, username:uname}); alert('تم الحفظ'); updateUIAfterAuth((await db.auth.getSession()).data.session); };
document.getElementById('changeAvatarBtn').onclick = () => document.getElementById('avatarUpload').click();
document.getElementById('avatarUpload').onchange = async (e) => { const f=e.target.files[0]; const ext=f.name.split('.').pop(); const path=`${window.currentUserId}-${Date.now()}.${ext}`; const {error}=await db.storage.from('avatars').upload(path,f); if(!error){ const {data:{publicUrl}}=db.storage.from('avatars').getPublicUrl(path); await db.from('profiles').update({avatar_url:publicUrl}).eq('id',window.currentUserId); updateUIAfterAuth((await db.auth.getSession()).data.session); } };
document.getElementById('deleteAccountBtn').onclick = async () => { if(confirm('حذف الحساب نهائياً؟')) await db.auth.signOut(); location.reload(); };
window.setLang = function(lang) { window._siteLanguage = lang; document.querySelectorAll('[data-ar]').forEach(el=>{ el.innerText = lang==='en' ? el.getAttribute('data-en') : el.getAttribute('data-ar'); }); if(window.allPosts) Object.keys(window.allPosts).forEach(room=>{ if(room==='yt-videos') renderYTPage(); else renderCards(window.allPosts[room], `grid-${room}`, room); }); };
initializeAuth();
async function initializeAuth() { const {data:{session}} = await db.auth.getSession(); await updateUIAfterAuth(session); loadPage('live'); loadPage('yt-videos'); loadPage('tournaments'); loadHomePanel(); }
window.deletePost = deletePost;
</script>
