    // حفظ في DB مع منع التكرار
    async function saveToDb(item, room, tag, channelId = null) {
      let { data: existing } = await supabaseClient.from('posts')
        .select('id').eq('url', item.videoUrl).limit(1);
      if (existing?.length) return false;

      // إذا كان لدينا ID القناة، نخزنه في الـ tag بشكل auto:ID لضمان الحذف السهل مستقبلاً
      const finalTag = channelId ? `auto:${channelId}` : tag;

      await supabaseClient.from('posts').insert({
        title: item.title,
        description: item.channelName,
        icon: item.thumbnail || (tag === 'Live Now' ? '🔴' : tag === 'Pre Lives' ? '⏰' : '📹'),
        url: item.videoUrl,
        tag: finalTag,
        room: room,
        content: item.publishedAt || ''
      });
      return true;
    }

    async function cleanupOrphanedVideos() {
      if (!confirm('سيتم حذف جميع الفيديوهات التي تنتمي لقنوات محذوفة. هل أنت متأكد؟')) return;
      try {
        console.log('⏳ جاري جلب البيانات للتنظيف...');
        // 1. جلب كل القنوات الموجودة حالياً
        let { data: channels } = await supabaseClient.from('posts').select('title').eq('room', 'yt-channels');
        let activeChannelTitles = (channels || []).map(c => c.title.trim().toLowerCase());

        // 2. جلب كل الفيديوهات والبثوث مع معرف الناشر
        let { data: videos } = await supabaseClient.from('posts').select('id, description, tag, user_id').in('room', ['yt-videos', 'live']);

        if (!videos || !videos.length) {
          alert('لا توجد فيديوهات لفحصها.');
          return;
        }

        // 3. تحديد الفيديوهات "اليتيمة" (التي جلبها البوت فقط ومسؤولها null)
        let orphanedIds = videos.filter(v => {
          // استثناء: إذا كان الفيديو منشورا يدويا (يملك user_id)، لا نلمسه أبدا
          if (v.user_id !== null) return false;

          if (!v.description) return false;
          const channelName = v.description.trim().toLowerCase();
          return !activeChannelTitles.includes(channelName);
        }).map(v => v.id);

        if (orphanedIds.length === 0) {
          alert('✅ لم يتم العثور على فيديوهات يتيمة. كل شيء نظيف!');
          return;
        }

        if (!confirm(`تم العثور على ${orphanedIds.length} فيديو تابع لقنوات محذوفة. هل تريد حذفها الآن؟`)) return;

        // 4. حذف الفيديوهات على دفعات (batches)
        const batchSize = 100;
        for (let i = 0; i < orphanedIds.length; i += batchSize) {
          const batch = orphanedIds.slice(i, i + batchSize);
          await supabaseClient.from('posts').delete().in('id', batch);
        }

        alert(`✅ تم تنظيف ${orphanedIds.length} فيديو بنجاح!`);
        loadDashboard();
      } catch (e) {
        alert('حدث خطأ أثناء التنظيف: ' + e.message);
      }
    }

    // الفحص الشامل لكل القنوات بطريقة موفرة للكريدي
    async function fetchDurations(videoIds) {
      if (!videoIds.length) return {};
      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${videoIds.join(',')}&key=${YOUTUBE_API_KEY}`);
        const d = await res.json();
        const map = {};
        (d.items || []).forEach(item => {
          const dur = item.contentDetails.duration;
          const match = dur.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
          const h = parseInt(match[1] || 0);
          const m = parseInt(match[2] || 0);
          const s = parseInt(match[3] || 0);
          const totalSeconds = h * 3600 + m * 60 + s;
          map[item.id] = totalSeconds <= 65; // سماحية بسيطة لـ 60 ثانية
        });
        return map;
      } catch (e) { return {}; }
    }

    async function autoCheckAllChannels(force = false) {
      try {
        if (force) console.log('🔄 فحص قسري لجميع القنوات...');
        // جلب القنوات المراقبة
        let { data: channels } = await supabaseClient.from('posts')
          .select('*').eq('room', 'yt-channels').eq('tag', 'Channel');
        if (!channels?.length) return;

        console.log(`🚀 بدء فحص ${channels.length} قناة...`);

        let newVideos = 0, newLive = 0, newUpcoming = 0;
        const now = Date.now();
        const ONE_DAY = 24 * 60 * 60 * 1000;

        for (let ch of channels) {
          // التحقق: هل تم فحص هذه القناة في آخر 24 ساعة؟ (إلا إذا كان الفحص قسرياً)
          let lastSync = parseInt(ch.content) || 0;
          if (!force && (now - lastSync < ONE_DAY)) {
            // console.log(`⏩ تخطي ${ch.title}: تم الفحص مؤخراً.`);
            continue;
          }

          let parsed = parseYouTubeUrl(ch.url);
          if (!parsed) continue;

          // جلب ID القناة (أو استنتاجه لتوفير الكوتا)
          let chInfo = await getChannelId(parsed);
          if (!chInfo) continue;

          // معرف قائمة الرفع (Uploads ID) هو نفس معرف القناة مع استبدال UC بـ UU
          let uploadsPlaylistId = chInfo.uploadsId || chInfo.id.replace('UC', 'UU');

          console.log(`🔄 جاري فحص: ${ch.title}...`);

          // ── 1. جلب الفيديوهات (تكلفة: 1 كريدت فقط لقائمة التشغيل + 1 لتفاصيل الفيديو) ──
          let videos = await fetchLatestVideos(uploadsPlaylistId, 10);
          if (videos.length > 0) {
            const vIds = videos.map(v => v.videoId);
            const durations = await fetchDurations(vIds);

            for (let v of videos) {
              // التحقق من المدة (أقل من 65 ثانية) أو وجود كلمة shorts
              const isShortByDur = durations[v.videoId] || false;
              const isShortByText = v.title.toLowerCase().includes('shorts') || v.description.toLowerCase().includes('shorts');
              const isShort = isShortByDur || isShortByText;

              const targetRoom = isShort ? 'reels' : 'yt-videos';
              const targetTag = isShort ? 'Reel' : 'Video';

              if (await saveToDb(v, targetRoom, targetTag, ch.id)) {
                newVideos++;
              }
            }
          }

          // ── 2. جلب البث المباشر والقادم (تكلفة: 1 كريدي فقط) ──
          let activities = await fetchActivities(chInfo.id);
          for (let act of activities) {
            if (act.type === 'live') {
              if (await saveToDb(act, 'live', 'Live Now', ch.id)) newLive++;
            } else {
              if (await saveToDb(act, 'live', 'Pre Lives', ch.id)) newUpcoming++;
            }
          }

          // تحديث وقت الفحص لمنع التكرار لمدة 24 ساعة
          await supabaseClient.from('posts').update({ content: now.toString() }).eq('id', ch.id);

          // تأخير بسيط لتجنب ضغط الطلبات
          await new Promise(r => setTimeout(r, 200));
        }

        console.log(`✅ انتهى الفحص: +${newVideos} فيديو | +${newLive} مباشر`);
        if (newVideos + newLive + newUpcoming > 0) {
          if (document.getElementById('content-yt-videos')) loadContentPage('yt-videos');
          if (document.getElementById('content-live')) loadContentPage('live');
        }
      } catch (e) { console.error('autoCheck error:', e); }
    }

    // ==================== بوت الأخبار (Gaming & YouTube) ====================

    const FORBIDDEN_KEYWORDS = ['sexy', 'bikini', 'hot girl', 'nude', 'adult', '18+', '🔞', 'رقص', 'فضيحة', 'إباحي', 'بنات', 'نساء', 'موسيقى', 'music'];

    function isContentSafe(text) {
      if (!text) return true;
      const lower = text.toLowerCase();
      // التحقق من الكلمات الممنوعة
      return !FORBIDDEN_KEYWORDS.some(k => lower.includes(k));
    }

    async function syncGamingNews(silent = false) {
      if (!silent && !confirm('هل تريد جلب آخر أخبار الألعاب الإلكترونية؟\n(سيتم استهداف أخبار PC, Console والمنصات الرسمية)')) return;
      try {
        console.log('⏳ جاري جلب أخبار الألعاب...');
        // استخدام رابط تغذية مخصص للألعاب فقط من IGN لتجنب أخبار الأفلام والمنوعات
        const rssUrl = encodeURIComponent('https://feeds.feedburner.com/ign/games-all');
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`);
        const data = await res.json();

        if (!data.items) throw new Error('تعذر جلب البيانات');

        const EXCLUDE_KEYWORDS = ['movie', 'film', 'netflix', 'series', 'tv show', 'marvel', 'dc', 'disney', 'cinema', 'أفلام', 'مسلسل', 'فيلم'];
        let count = 0;
        for (let item of data.items) {
          const title = item.title.toLowerCase();
          const desc = (item.description || '').toLowerCase();
          const text = title + ' ' + desc;

          // 1. استبعاد الكلمات غير المرتبطة بالألعاب الإلكترونية (أفلام، مسلسلات، إلخ)
          const hasExclude = EXCLUDE_KEYWORDS.some(k => text.includes(k));
          if (hasExclude) continue;

          // 2. تصفية المحتوى ليكون متعلقاً بالألعاب والمنصات المطلوبة حصراً
          const isRelevant = text.includes('videogame') || text.includes('gameplay') || text.includes('steam') || text.includes('epic') ||
            text.includes('playstation') || text.includes('ps5') || text.includes('xbox') || text.includes('nintendo') ||
            text.includes('pc gaming') || text.includes('patch notes') || text.includes('remake') || text.includes('rpg') || text.includes('fps');

          if (isRelevant && isContentSafe(item.title) && isContentSafe(item.description)) {
            let { data: existing } = await supabaseClient.from('posts').select('id').eq('url', item.link).limit(1);
            if (existing?.length) continue;

            await supabaseClient.from('posts').insert({
              title: item.title,
              description: item.author || 'Gaming News',
              icon: item.thumbnail || item.enclosure?.link || '📰',
              url: item.link,
              tag: 'News',
              room: 'gaming-news',
              content: item.description || ''
            });
            count++;
          }
          if (count >= 10) break;
        }
        if (!silent) alert(`✅ تم جلب ${count} خبر جديد للألعاب الإلكترونية.`);
        loadDashboard();
      } catch (e) { if (!silent) alert('❌ فشل جلب الأخبار: ' + e.message); }
    }

        // تم استخدام ROLE_META العالمي
        function getRoles(u) { if (Array.isArray(u.roles) && u.roles.length) return u.roles; if (u.role) return [u.role]; return ['user']; }

    async function toggleRole(userId, roleKey, add) {
      try {
        let { data: profile } = await supabaseClient.from('profiles').select('roles').eq('id', userId).single();
        let roles = Array.isArray(profile?.roles) ? profile.roles : (profile?.role ? [profile.role] : []);

        if (add) {
          if (!roles.includes(roleKey)) roles.push(roleKey);
        } else {
          roles = roles.filter(r => r !== roleKey);
        }

        const { error } = await supabaseClient.from('profiles').update({ roles: roles, role: roles[0] || 'user' }).eq('id', userId);
        if (error) throw error;
        return true;

    async function cleanupOrphanedVideos() {
      if (!confirm('سيتم حذف جميع الفيديوهات التي لا تنتمي لأي قناة مسجلة حالياً. هل أنت متأكد؟')) return;
      try {
        // 1. جلب كل القنوات الحالية
        let { data: channels } = await supabaseClient.from('posts').select('id, title').eq('room', 'yt-channels');
        let activeChannelTitles = (channels || []).map(c => c.title.trim());
        let activeChannelIds = (channels || []).map(c => `auto:${c.id}`);

        // 2. جلب كل الفيديوهات والبثوث
        let { data: videos } = await supabaseClient.from('posts').select('id, description, tag').in('room', ['yt-videos', 'live', '_trash']);

        if (!videos) return;

        // 3. تحديد اليتامى
        let orphanedIds = videos.filter(v => {
          const channelName = v.description ? v.description.trim() : '';
          const tag = v.tag || '';

          // إذا كان الفيديو مرتبط بالاسم أو الـ ID النشط فهو ليس يتيماً
          const isLinkedByName = activeChannelTitles.includes(channelName);
          const isLinkedById = activeChannelIds.includes(tag);

          return !isLinkedByName && !isLinkedById;
        }).map(v => v.id);

        if (orphanedIds.length === 0) {
          alert('✨ لا توجد فيديوهات يتيمة حالياً. قاعدة البيانات نظيفة!');
          return;
        }

        if (!confirm(`تم العثور على ${orphanedIds.length} فيديو يتيم. هل تريد حذفها نهائياً؟`)) return;

        // 4. حذف على دفعات لتجنب حدود الـ API
        const chunkSize = 100;
        for (let i = 0; i < orphanedIds.length; i += chunkSize) {
          const chunk = orphanedIds.slice(i, i + chunkSize);
          await supabaseClient.from('posts').delete().in('id', chunk);
        }

        alert(`✅ تم تنظيف ${orphanedIds.length} فيديو بنجاح!`);
        loadDashboard();
      } catch (e) {
        alert('❌ خطأ في عملية التنظيف: ' + e.message);
      }
    }

  <script>
    // ===== 3D SPACE TUNNEL + FLOATING CUBES BACKGROUND =====
    (function () {
      const canvas = document.getElementById('bgCanvas');
      if (!canvas) return;
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) {
        // Fallback: 2D canvas 3D effect
        fallback2D(canvas);
        return;
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gl.viewport(0, 0, canvas.width, canvas.height);
      }
      resize();
      window.addEventListener('resize', resize);

      // Vertex shader
      const vsSource = `
    attribute vec3 aPos;
    attribute vec3 aColor;
    uniform mat4 uMVP;
    varying vec3 vColor;
    varying float vDepth;
    void main() {
      vec4 pos = uMVP * vec4(aPos, 1.0);
      gl_Position = pos;
      vColor = aColor;
      vDepth = pos.z;
    }
  `;
      const fsSource = `
    precision mediump float;
    varying vec3 vColor;
    varying float vDepth;
    void main() {
      float fog = clamp(1.0 - vDepth * 0.18, 0.0, 1.0);
      gl_FragColor = vec4(vColor * fog, fog * 0.92);
    }
  `;

      function compileShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }

      const prog = gl.createProgram();
      gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vsSource));
      gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const aPos = gl.getAttribLocation(prog, 'aPos');
      const aColor = gl.getAttribLocation(prog, 'aColor');
      const uMVP = gl.getUniformLocation(prog, 'uMVP');

      // Math helpers
      function mat4() { return new Float32Array(16); }
      function identity(m) {
        m[0] = 1; m[1] = 0; m[2] = 0; m[3] = 0;
        m[4] = 0; m[5] = 1; m[6] = 0; m[7] = 0;
        m[8] = 0; m[9] = 0; m[10] = 1; m[11] = 0;
        m[12] = 0; m[13] = 0; m[14] = 0; m[15] = 1;
        return m;
      }
      function perspective(m, fov, aspect, near, far) {
        const f = 1.0 / Math.tan(fov / 2);
        const nf = 1 / (near - far);
        m[0] = f / aspect; m[1] = 0; m[2] = 0; m[3] = 0;
        m[4] = 0; m[5] = f; m[6] = 0; m[7] = 0;
        m[8] = 0; m[9] = 0; m[10] = (far + near) * nf; m[11] = -1;
        m[12] = 0; m[13] = 0; m[14] = 2 * far * near * nf; m[15] = 0;
        return m;
      }
      function multiply(out, a, b) {
        for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
          out[j * 4 + i] = 0;
          for (let k = 0; k < 4; k++) out[j * 4 + i] += a[k * 4 + i] * b[j * 4 + k];
        }
        return out;
      }
      function rotateY(m, angle) {
        const c = Math.cos(angle), s = Math.sin(angle);
        const r = identity(mat4());
        r[0] = c; r[2] = s; r[8] = -s; r[10] = c;
        return multiply(mat4(), m, r);
      }
      function rotateX(m, angle) {
        const c = Math.cos(angle), s = Math.sin(angle);
        const r = identity(mat4());
        r[5] = c; r[6] = -s; r[9] = s; r[10] = c;
        return multiply(mat4(), m, r);
      }
      function translate(m, tx, ty, tz) {
        const r = identity(mat4());
        r[12] = tx; r[13] = ty; r[14] = tz;
        return multiply(mat4(), m, r);
      }

      // Cube geometry
      function makeCubeEdges(cx, cy, cz, size, r, g, b) {
        const s = size / 2;
        const verts = [
          [cx - s, cy - s, cz - s], [cx + s, cy - s, cz - s], [cx + s, cy + s, cz - s], [cx - s, cy + s, cz - s],
          [cx - s, cy - s, cz + s], [cx + s, cy - s, cz + s], [cx + s, cy + s, cz + s], [cx - s, cy + s, cz + s]
        ];
        const edges = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
        const pos = [], col = [];
        edges.forEach(([a, b]) => {
          pos.push(...verts[a], ...verts[b]);
          col.push(r, g, b, r, g, b);
        });
        return { pos, col };
      }

      // Generate floating cubes
      function randomColor() {
        const palettes = [
          [0.9, 0.0, 0.0],   // red
          [1.0, 0.2, 0.1],   // bright red
          [0.7, 0.0, 0.0],   // dark red
          [0.5, 0.0, 0.0],   // deep red
          [1.0, 0.1, 0.0],   // red-orange
          [0.8, 0.05, 0.05],  // crimson
        ];
        return palettes[Math.floor(Math.random() * palettes.length)];
      }

      const numCubes = 60;
      const cubes = Array.from({ length: numCubes }, () => ({
        x: (Math.random() - 0.5) * 20,
        y: (Math.random() - 0.5) * 20,
        z: -Math.random() * 40,
        size: 0.3 + Math.random() * 1.2,
        rx: Math.random() * Math.PI * 2,
        ry: Math.random() * Math.PI * 2,
        rz: Math.random() * Math.PI * 2,
        drx: (Math.random() - 0.5) * 0.015,
        dry: (Math.random() - 0.5) * 0.02,
        drz: (Math.random() - 0.5) * 0.012,
        speed: 0.04 + Math.random() * 0.06,
        color: randomColor()
      }));

      // Star particles (3D)
      const stars3d = Array.from({ length: 300 }, () => ({
        x: (Math.random() - 0.5) * 50,
        y: (Math.random() - 0.5) * 50,
        z: -Math.random() * 60
      }));

      // Grid tunnel rings
      const tunnelRings = Array.from({ length: 20 }, (_, i) => ({
        z: -i * 3.5,
        angle: i * 0.1
      }));

      gl.enable(gl.DEPTH_TEST);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

      let t = 0;

      function buildAndDrawBuffer(positions, colors, mode) {
        if (positions.length === 0) return;
        const posBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.DYNAMIC_DRAW);
        gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(aPos);

        const colBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.DYNAMIC_DRAW);
        gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(aColor);

        gl.drawArrays(mode, 0, positions.length / 3);
        gl.deleteBuffer(posBuf);
        gl.deleteBuffer(colBuf);
      }

      function drawCubeEdges(cube, proj, view) {
        const s = cube.size / 2;
        const verts = [
          [-s, -s, -s], [s, -s, -s], [s, s, -s], [-s, s, -s],
          [-s, -s, s], [s, -s, s], [s, s, s], [-s, s, s]
        ];
        const edges = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]];

        let model = identity(mat4());
        model = rotateX(model, cube.rx);
        model = rotateY(model, cube.ry);
        model[12] = cube.x; model[13] = cube.y; model[14] = cube.z;

        const mvp = multiply(mat4(), proj, multiply(mat4(), view, model));
        gl.uniformMatrix4fv(uMVP, false, mvp);

        const pos = [], col = [];
        const [r, g, b] = cube.color;
        edges.forEach(([a, bb]) => {
          pos.push(...verts[a], ...verts[bb]);
          col.push(r, g, b, r, g, b);
        });
        buildAndDrawBuffer(pos, col, gl.LINES);
      }

      function drawTunnelRing(ring, proj, view) {
        const segs = 16;
        const radius = 6 + Math.sin(t * 0.5 + ring.z * 0.1) * 1.5;
        const pos = [], col = [];
        for (let i = 0; i < segs; i++) {
          const a1 = (i / segs) * Math.PI * 2 + ring.angle;
          const a2 = ((i + 1) / segs) * Math.PI * 2 + ring.angle;
          pos.push(Math.cos(a1) * radius, Math.sin(a1) * radius, ring.z);
          pos.push(Math.cos(a2) * radius, Math.sin(a2) * radius, ring.z);
          const glow = 0.3 + 0.5 * Math.abs(Math.sin(t * 0.8 + i * 0.4));
          col.push(glow, glow * 0.1, 0);
          col.push(glow, glow * 0.1, 0);
        }
        let model = identity(mat4());
        const mvp = multiply(mat4(), proj, multiply(mat4(), view, model));
        gl.uniformMatrix4fv(uMVP, false, mvp);
        buildAndDrawBuffer(pos, col, gl.LINES);
      }

      function drawStars(proj, view) {
        const pos = [], col = [];
        stars3d.forEach(s => {
          pos.push(s.x, s.y, s.z);
          const br = 0.5 + 0.5 * Math.sin(t * 2 + s.x + s.y);
          col.push(br, br, br);
        });
        let model = identity(mat4());
        const mvp = multiply(mat4(), proj, multiply(mat4(), view, model));
        gl.uniformMatrix4fv(uMVP, false, mvp);
        const posBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos), gl.DYNAMIC_DRAW);
        gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(aPos);
        const colBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(col), gl.DYNAMIC_DRAW);
        gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(aColor);
        gl.drawArrays(gl.POINTS, 0, pos.length / 3);
        gl.deleteBuffer(posBuf);
        gl.deleteBuffer(colBuf);
      }

      function animate() {
        t += 0.016;
        const W = canvas.width, H = canvas.height;
        gl.clearColor(0.04, 0.0, 0.0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        const proj = perspective(mat4(), 0.9, W / H, 0.1, 80);
        const camZ = t * 0.4;
        const camX = Math.sin(t * 0.15) * 1.2;
        const camY = Math.cos(t * 0.12) * 0.8;

        let view = identity(mat4());
        view[12] = -camX; view[13] = -camY; view[14] = 2;

        // Draw stars
        drawStars(proj, view);

        // Draw tunnel rings
        tunnelRings.forEach(ring => {
          ring.z += 0.04;
          ring.angle += 0.004;
          if (ring.z > 4) ring.z -= 20 * 3.5 / tunnelRings.length + 70;
          drawTunnelRing(ring, proj, view);
        });

        // Draw cubes
        cubes.forEach(cube => {
          cube.z += cube.speed;
          cube.rx += cube.drx;
          cube.ry += cube.dry;
          cube.rz += cube.drz;
          if (cube.z > 5) {
            cube.z = -40 - Math.random() * 20;
            cube.x = (Math.random() - 0.5) * 20;
            cube.y = (Math.random() - 0.5) * 20;
            cube.color = randomColor();
          }
          drawCubeEdges(cube, proj, view);
        });

        // Draw connecting lines between nearby cubes
        const linPos = [], linCol = [];
        for (let i = 0; i < cubes.length; i++) {
          for (let j = i + 1; j < cubes.length; j++) {
            const dx = cubes[i].x - cubes[j].x, dy = cubes[i].y - cubes[j].y, dz = cubes[i].z - cubes[j].z;
            const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
            if (dist < 3.5) {
              const alpha = (1 - dist / 3.5) * 0.4;
              linPos.push(cubes[i].x, cubes[i].y, cubes[i].z, cubes[j].x, cubes[j].y, cubes[j].z);
              linCol.push(alpha, alpha * 0.1, 0, alpha, alpha * 0.1, 0);
            }
          }
        }
        if (linPos.length > 0) {
          let model = identity(mat4());
          const mvp = multiply(mat4(), proj, multiply(mat4(), view, model));
          gl.uniformMatrix4fv(uMVP, false, mvp);
          buildAndDrawBuffer(linPos, linCol, gl.LINES);
        }

        requestAnimationFrame(animate);
      }

      animate();

      // 2D fallback
      function fallback2D(c) {
        const ctx = c.getContext('2d');
        function resz() { c.width = window.innerWidth; c.height = window.innerHeight; }
        resz(); window.addEventListener('resize', resz);
        const pts = Array.from({ length: 120 }, () => ({
          x: Math.random(), y: Math.random(),
          vx: (Math.random() - 0.5) * 0.002, vy: (Math.random() - 0.5) * 0.002,
          r: Math.random() * 2 + 1,
          c: `hsl(${Math.random() * 20},100%,${50 + Math.random() * 30}%)`
        }));
        function frame() {
          ctx.fillStyle = 'rgba(10,0,0,0.18)';
          ctx.fillRect(0, 0, c.width, c.height);
          pts.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > 1) p.vx *= -1;
            if (p.y < 0 || p.y > 1) p.vy *= -1;
            ctx.fillStyle = p.c;
            ctx.beginPath();
            ctx.arc(p.x * c.width, p.y * c.height, p.r, 0, Math.PI * 2);
            ctx.fill();
          });
          pts.forEach((a, i) => pts.slice(i + 1).forEach(b => {
            const dx = (a.x - b.x) * c.width, dy = (a.y - b.y) * c.height;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d < 120) { ctx.strokeStyle = `rgba(220,30,0,${(1 - d / 120) * 0.3})`; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(a.x * c.width, a.y * c.height); ctx.lineTo(b.x * c.width, b.y * c.height); ctx.stroke(); }
          }));
          requestAnimationFrame(frame);
        }
        frame();
      }
    })();

    // بدء الفحص التلقائي
    setTimeout(startAutoCheck, 3000);
    setTimeout(startNewsAutoSync, 5000);
  </script>
