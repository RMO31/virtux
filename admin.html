<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtux Admin</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0a0000;
      color: #fff;
      min-height: 100vh;
      overflow: hidden
    }

    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none
    }

    #loginPage,
    #adminPage {
      position: relative;
      z-index: 1
    }

    #loginPage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: transparent
    }

    .login-box {
      background: rgba(15, 0, 0, 0.92);
      border: 1px solid #cc0000;
      border-radius: 14px;
      padding: 36px 32px;
      width: 340px;
      text-align: center;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 40px rgba(200, 0, 0, 0.2)
    }

    .login-box h1 {
      color: #ff3333;
      font-size: 24px;
      margin-bottom: 6px
    }

    .login-box p {
      color: #776;
      font-size: 13px;
      margin-bottom: 24px
    }

    .login-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 7px;
      border: 1px solid #440000;
      background: #1a0000;
      color: #fff;
      font-size: 14px;
      margin-bottom: 12px
    }

    .login-box input:focus {
      outline: none;
      border-color: #cc0000
    }

    .btn-login {
      width: 100%;
      padding: 10px;
      background: #cc0000;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer
    }

    .btn-login:hover {
      background: #ff3333
    }

    .err {
      color: #f55;
      font-size: 12px;
      margin-top: 8px;
      display: none
    }

    #adminPage {
      display: none;
      height: 100vh;
      flex-direction: column;
      background: transparent
    }

    .topbar {
      background: rgba(10, 0, 0, 0.95);
      border-bottom: 1px solid #cc0000;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(4px)
    }

    .topbar h1 {
      color: #ff3333;
      font-size: 16px
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .conn {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 4px;
      background: #0f3d2e;
      color: #4caf90;
      border: 1px solid #0f6e56
    }

    .conn.fail {
      background: #3d0f0f;
      color: #f55;
      border-color: #6e0f0f
    }

    .btn-logout {
      background: transparent;
      border: 1px solid #f55;
      color: #f55;
      padding: 4px 12px;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer
    }

    .btn-logout:hover {
      background: #f55;
      color: #fff
    }

    .body {
      display: flex;
      flex: 1;
      height: calc(100vh - 46px)
    }

    .sidebar {
      width: 190px;
      background: rgba(15, 0, 0, 0.92);
      border-right: 1px solid #440000;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
      backdrop-filter: blur(3px)
    }

    .sb-btn {
      background: transparent;
      border: none;
      color: #bba;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      text-align: left
    }

    .sb-btn:hover,
    .sb-btn.active {
      background: #3a0000;
      color: #ff3333
    }

    .sb-btn.active {
      border-left: 3px solid #ff3333
    }

    .sb-sec {
      font-size: 10px;
      color: #665;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 10px 12px 3px
    }

    .main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: rgba(8, 0, 0, 0.88);
      backdrop-filter: blur(2px)
    }

    .ap {
      display: none
    }

    .ap.active {
      display: block
    }

    .page-title {
      font-size: 18px;
      color: #ff3333;
      font-weight: 700;
      margin-bottom: 16px
    }

    .card {
      background: #120000;
      border: 1px solid #330000;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px
    }

    .card h3 {
      color: #cc0000;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px
    }

    .fg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px
    }

    .fg input,
    .fg select,
    .fg textarea {
      padding: 9px 12px;
      border-radius: 7px;
      border: 1px solid #440000;
      background: #1a0000;
      color: #fff;
      font-size: 13px;
      width: 100%
    }

    .full {
      grid-column: 1/-1
    }

    .btn-pub {
      background: #cc0000;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 9px 22px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer
    }

    .btn-pub:hover {
      background: #ff3333
    }

    .btn-pub:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed
    }

    .ok {
      background: #0f3d2e;
      border: 1px solid #0f6e56;
      color: #4caf90;
      border-radius: 7px;
      padding: 9px 14px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none
    }

    .er {
      background: #3d0f0f;
      border: 1px solid #6e0f0f;
      color: #f55;
      border-radius: 7px;
      padding: 9px 14px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none
    }

    .img-upload {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .img-upload input[type=file] {
      display: none
    }

    .img-upload label {
      background: #3a0000;
      color: #ff3333;
      border: 1px solid #440000;
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer
    }

    .img-preview {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      display: none
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 18px
    }

    .stat-card {
      background: #120000;
      border: 1px solid #330000;
      border-radius: 10px;
      padding: 14px;
      text-align: center
    }

    .stat-number {
      font-size: 28px;
      font-weight: 700;
      color: #ff3333
    }

    .stat-label {
      font-size: 11px;
      color: #887;
      margin-top: 4px
    }

    .posts-list {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .pi {
      background: #1a0000;
      border: 1px solid #330000;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px
    }

    .pi-icon {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2a0000;
      font-size: 20px
    }

    .pi-info {
      flex: 1
    }

    .pi-title {
      font-size: 13px;
      font-weight: 600;
      color: #ddd
    }

    .pi-meta {
      font-size: 11px;
      color: #776;
      margin-top: 2px
    }

    .pi-tag {
      display: inline-block;
      font-size: 10px;
      background: #2a0000;
      color: #ff3333;
      border-radius: 3px;
      padding: 1px 7px;
      margin-top: 3px
    }

    .btn-edit {
      background: #3a0000;
      border: 1px solid #cc0000;
      color: #ff3333;
      border-radius: 5px;
      padding: 5px 12px;
      font-size: 11px;
      cursor: pointer
    }

    .btn-del {
      background: transparent;
      border: 1px solid #f55;
      color: #f55;
      border-radius: 5px;
      padding: 5px 12px;
      font-size: 11px;
      cursor: pointer
    }

    .btn-edit:hover {
      background: #cc0000;
      color: #fff
    }

    .btn-del:hover {
      background: #f55;
      color: #fff
    }

    .empty {
      text-align: center;
      color: #554;
      padding: 30px;
      font-size: 13px
    }

    .loading {
      text-align: center;
      color: #776;
      padding: 20px;
      font-size: 13px
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center
    }

    .modal-overlay.open {
      display: flex
    }

    .modal-box {
      background: #120000;
      border: 1px solid #cc0000;
      border-radius: 14px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto
    }

    .modal-top {
      background: #0a0000;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #330000
    }

    .modal-top h2 {
      font-size: 16px;
      color: #ff3333
    }

    .modal-close {
      background: transparent;
      border: 1px solid #556;
      color: #aaa;
      width: 28px;
      height: 28px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px
    }

    .modal-body {
      padding: 18px
    }

    .channel-card-admin {
      background: #1a0000;
      border: 1px solid #330000;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px
    }

    .channel-avatar-admin {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover
    }

    .channel-info-admin {
      flex: 1
    }

    .channel-name-admin {
      font-size: 13px;
      font-weight: 600;
      color: #ff3333
    }

    .channel-sub-admin {
      font-size: 11px;
      color: #aaa
    }

    .channel-link-admin {
      color: #cc0000;
      font-size: 11px;
      text-decoration: none
    }

    .preview-panel {
      background: #1a0000;
      border: 1px solid #330000;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .preview-media {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 12px
    }

    .preview-buttons {
      display: flex;
      gap: 8px;
      justify-content: center
    }

    .form-with-preview {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      align-items: start
    }

    @media (max-width:768px) {
      .form-with-preview {
        grid-template-columns: 1fr
      }
    }

    .role-search-input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 7px;
      border: 1px solid #440000;
      background: #1a0000;
      color: #fff
    }

    .role-search-results {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 10px
    }

    .role-search-result-item {
      background: #1a0000;
      border: 1px solid #330000;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .role-buttons button {
      margin-left: 5px;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer
    }

    .recent-member-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #330000
    }

    .recent-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #3a0000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px
    }

    .news-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-bottom: 1px solid #330000
    }

    .news-text {
      flex: 1;
      font-size: 13px
    }

    .news-link {
      font-size: 11px;
      color: #cc0000;
      text-decoration: none
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background:
        radial-gradient(circle at top right, rgba(255, 72, 72, 0.18), transparent 26%),
        radial-gradient(circle at left bottom, rgba(255, 170, 0, 0.12), transparent 25%),
        linear-gradient(160deg, #0b0608 0%, #15060a 45%, #0b0f15 100%);
    }

    .login-box,
    .topbar,
    .sidebar,
    .main,
    .card,
    .stat-card,
    .pi,
    .modal-box,
    .channel-card-admin,
    .preview-panel {
      backdrop-filter: blur(18px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, .24);
    }

    .login-box {
      width: min(420px, 92vw);
      border-radius: 24px;
      padding: 40px 34px;
      border-color: rgba(255, 102, 102, .35);
      background: linear-gradient(145deg, rgba(255, 70, 70, 0.10), transparent 35%), rgba(14, 4, 6, 0.86);
    }

    .login-box h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      letter-spacing: 1px;
      color: #fff2f2;
    }

    .login-box p {
      color: #b89ea2
    }

    .login-box input,
    .fg input,
    .fg select,
    .fg textarea,
    .role-search-input {
      border-radius: 12px;
      border-color: rgba(255, 255, 255, .08);
      background: rgba(255, 255, 255, .04);
    }

    .btn-login,
    .btn-pub {
      background: linear-gradient(135deg, #ff5645, #ffb347);
      color: #180a06;
      border-radius: 12px;
      box-shadow: 0 14px 26px rgba(255, 86, 69, .22);
    }

    .topbar {
      padding: 14px 22px;
      background: rgba(10, 4, 6, 0.74);
      border-bottom-color: rgba(255, 94, 94, .28);
    }

    .topbar h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      color: #fff;
      letter-spacing: 1px;
    }

    .sidebar {
      width: 220px;
      background: rgba(12, 5, 7, 0.78);
      border-right-color: rgba(255, 255, 255, .08);
      padding: 14px 10px;
    }

    .sb-btn {
      border-radius: 12px;
      padding: 11px 14px;
      color: #d8c4c7;
      transition: .2s ease;
    }

    .sb-btn:hover,
    .sb-btn.active {
      background: linear-gradient(135deg, rgba(255, 87, 87, .18), rgba(255, 179, 71, .10));
      color: #fff;
    }

    .main {
      background: rgba(8, 5, 7, 0.62);
      padding: 24px;
    }

    .page-title {
      color: #fff;
      font-size: 24px;
      font-weight: 800;
    }

    .card,
    .stat-card,
    .pi,
    .channel-card-admin,
    .preview-panel,
    .modal-box {
      background: rgba(20, 8, 10, 0.82);
      border-color: rgba(255, 255, 255, .07);
      border-radius: 18px;
    }

    .card h3,
    .channel-name-admin,
    .stat-number,
    .modal-top h2 {
      color: #ffd2b8
    }

    .stat-number {
      text-shadow: 0 0 18px rgba(255, 120, 80, .18)
    }

    .modal-top {
      background: rgba(0, 0, 0, .24);
      border-bottom-color: rgba(255, 255, 255, .07);
    }

    .btn-edit,
    .btn-del,
    .btn-logout,
    .modal-close {
      border-radius: 10px
    }

    .btn-edit {
      background: rgba(255, 98, 98, .08);
      border-color: rgba(255, 120, 120, .4);
    }

    .btn-del {
      background: rgba(255, 255, 255, .02);
      border-color: rgba(255, 120, 120, .35);
    }

    .tm-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 2000;
      align-items: center;
      justify-content: center
    }

    .tm-modal.active {
      display: flex
    }

    .tm-box {
      background: #120000;
      border: 1px solid #cc0000;
      border-radius: 14px;
      width: 90%;
      max-width: 800px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      position: relative
    }

    @media (max-width:768px) {
      .sidebar {
        width: 188px
      }

      .main {
        padding: 18px
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <canvas id="bgCanvas"></canvas>

  <!-- Tournament Management Modal -->
  <div id="tournamentManagementModal" class="tm-modal">
    <div class="tm-box">
      <button onclick="closeTournamentManagement()"
        style="position:absolute; top:15px; right:15px; background:transparent; border:1px solid #444; color:#aaa; width:30px; height:30px; border-radius:5px; cursor:pointer;">✕</button>
      <h2 id="tm-title" style="color:#00f5ff; margin-bottom:20px; font-size:22px;"></h2>

      <div id="tm-setup" style="display:none; text-align:center; padding:40px;">
        <p style="color:#aaa; margin-bottom:20px;">البطولة جاهزة للبدء. اختر نظام البطولة:</p>
        <div style="display:flex; justify-content:center; gap:20px;">
          <button class="btn-pub" onclick="initializeTournament('bracket')"
            style="background:#00f5ff; color:#000; width:150px;">🌳 شجرة</button>
          <button class="btn-pub" onclick="initializeTournament('league')"
            style="background:#ffd2b8; color:#000; width:150px;">📋 دوري</button>
          <button class="btn-pub" onclick="initializeTournament('groups_bracket')"
            style="background:#ff9800; color:#000; width:150px;">🧬 مجموعات + شجرة</button>
        </div>
        <div id="tm-setup-msg" style="margin-top:15px; font-size:12px; color:#888;">سيتم جلب جميع اللاعبين "المقبولين"
          تلقائياً.</div>
      </div>

      <div id="tm-dashboard" style="display:none;">
        <div
          style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #30363d; padding-bottom:15px;">
          <div id="tm-info" style="font-size:14px; color:#aaa;"></div>
          <div style="display:flex; gap:10px;">
            <button class="btn-pub" onclick="saveTournamentData()"
              style="background:#4caf90; width:auto; padding:8px 16px;">💾 حفظ التغييرات</button>
            <button class="btn-del" id="btn-finish-tour" onclick="finishTournament()"
              style="width:auto; padding:8px 16px;">🏁 إنهاء البطولة</button>
          </div>
        </div>

        <div id="tm-view" style="overflow-x:auto; padding-bottom:20px; min-height:400px;">
          <!-- Bracket or League Content here -->
        </div>
      </div>

      <div id="tm-finished" style="display:none; text-align:center;">
        <h3 style="color:#4caf50; margin-bottom:20px;">🏁 انتهت البطولة!</h3>
        <div id="tm-rankings" style="max-width:600px; margin:0 auto; text-align:left;"></div>
        <button class="btn-pub" onclick="reopenTournament()"
          style="margin-top:20px; width:auto; padding:8px 20px; background:rgba(255,255,255,0.05); color:#aaa; border:1px solid #444;">♻️
          إعادة فتح البطولة (تعديل النتائج)</button>
      </div>
    </div>
  </div>

  <div id="loginPage">
    <div class="login-box">
      <h1>🎮 Virtux Admin</h1>
      <p>أدخل كلمة المرور</p>
      <input type="password" id="pw" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')login()">
      <button class="btn-login" onclick="login()">دخول</button>
      <div class="err" id="loginErr">كلمة المرور خاطئة!</div>
    </div>
  </div>

  <div id="adminPage">
    <div class="topbar">
      <h1>🎮 Virtux Admin Panel</h1>
      <div class="topbar-right">
        <span class="conn" id="connStatus">جارٍ الاتصال...</span>
        <button class="btn-logout" onclick="logout()">تسجيل خروج</button>
      </div>
    </div>
    <div class="body">
      <div class="sidebar">
        <button class="sb-btn active" id="sb-dashboard" onclick="showPage('dashboard')">📊 Dashboard</button>
        <div class="sb-sec">الأقسام</div>
        <button class="sb-btn" id="sb-home" onclick="showPage('home')">🏠 Home</button>
        <button class="sb-btn" id="sb-live" onclick="showPage('live')">🔴 Live</button>
        <button class="sb-btn" id="sb-tournaments" onclick="showPage('tournaments')">🏆 Tournaments</button>
        <button class="sb-btn" id="sb-registrations" onclick="showPage('registrations')">📋 طلبات التسجيل</button>
        <button class="sb-btn" id="sb-highlights" onclick="showPage('highlights')">🎬 Highlights</button>
        <button class="sb-btn" id="sb-subscribers" onclick="showPage('subscribers')">👥 Subscribers</button>

    async function openTournamentManagement(postId, title) {

    function renderTourDashboard() {
      const setup = document.getElementById('tm-setup');
      const dash = document.getElementById('tm-dashboard');
      const finished = document.getElementById('tm-finished');

      setup.style.display = 'none';
      dash.style.display = 'none';
      finished.style.display = 'none';

      if (!currentTourData || !currentTourData.status) {
        setup.style.display = 'block';
      } else if (currentTourData.status === 'registration' || currentTourData.status === 'ongoing') {
        dash.style.display = 'block';
        renderMatchView();
      } else if (currentTourData.status === 'finished') {
        finished.style.display = 'block';
        renderRankings();
      }
    }

    async function initializeTournament(type) {
      if (!confirm('هل تريد بدء البطولة بنظام ' + (type === 'bracket' ? 'الشجرة' : 'الدوري') + '؟ سيتم جلب قائمة المقبولين الآن.')) return;

      try {
        const { data: regs, error } = await supabaseClient.from('posts')
          .select('*')
          .eq('room', '_registrations')
          .eq('url', currentTourId)
          .eq('description', 'accepted');

        if (error) throw error;
        if (!regs || regs.length < 2) {
          alert('يجب وجود لاعبين مقبولين (2 على الأقل) لبدء البطولة.');
          return;
        }

        const players = regs.map(r => ({
          id: r.user_id,
          name: r.title,
          avatar: r.icon
        }));

        let data = {
          type: type,
          status: 'ongoing',
          participants: players,
          matches: [],
          rankings: []
        };

        if (type === 'bracket') {
          let firstRound = [];
          for (let i = 0; i < players.length; i += 2) {
            firstRound.push({
              id: 'r1-m' + (i / 2),
              p1: players[i],
              p2: players[i + 1] || { name: 'BYE', id: 'bye' },
              score1: 0,
              score2: 0,
              winner: (players[i + 1] ? null : players[i].id)
            });
          }
          data.matches = [firstRound];
        } else if (type === 'league') {
          data.league = players.map(p => ({
            ...p,
            p: 0, w: 0, d: 0, l: 0, pts: 0
          }));
        } else if (type === 'groups_bracket') {
          // نظام مجموعات + شجرة
          const numGroups = parseInt(prompt('عدد المجموعات؟', '2')) || 2;
          const advPerGroup = parseInt(prompt('عدد المتأهلين من كل مجموعة؟', '2')) || 2;
          data.groups = [];
          data.advPerGroup = advPerGroup;

          // توزيع اللاعبين بشكل عشوائي
          const shuffled = [...players].sort(() => 0.5 - Math.random());
          for (let i = 0; i < numGroups; i++) {
            data.groups.push({
              name: `المجموعة ${i + 1}`,
              players: []
            });
          }
          shuffled.forEach((p, idx) => {
            data.groups[idx % numGroups].players.push({
              ...p, p: 0, w: 0, d: 0, l: 0, pts: 0
            });
          });
        }

        currentTourData = data;
        await saveTournamentData();
        renderTourDashboard();

      } catch (e) {
        alert('فشل تهيئة البطولة: ' + e.message);
      }
    }

    function renderMatchView() {
      const container = document.getElementById('tm-view');
      const info = document.getElementById('tm-info');
      info.innerText = `النظام: ${currentTourData.type === 'bracket' ? 'شجرة' : 'دوري'} • عدد المتنافسين: ${currentTourData.participants.length}`;

      if (currentTourData.type === 'bracket') {
        let html = `<div style="display:flex; gap:40px;">`;
        currentTourData.matches.forEach((round, rIndex) => {
          html += `<div class="bracket-round">
        <h4 style="color:#00f5ff; font-size:12px; margin-bottom:10px;">الجولة ${rIndex + 1}</h4>`;
          round.forEach((m, mIndex) => {
            html += `<div class="match-box">
          <div class="match-p ${m.winner === m.p1?.id ? 'winner' : ''}" onclick="setMatchWinner(${rIndex}, ${mIndex}, 1)">
            <span>${escapeHtml(m.p1?.name || '???')}</span>
            <input type="number" value="${m.score1}" onchange="updateMatchScore(${rIndex}, ${mIndex}, 1, this.value)" onclick="event.stopPropagation()">
          </div>
          <div class="match-p ${m.winner === m.p2?.id ? 'winner' : ''}" onclick="setMatchWinner(${rIndex}, ${mIndex}, 2)">
            <span>${escapeHtml(m.p2?.name || '???')}</span>
            <input type="number" value="${m.score2}" onchange="updateMatchScore(${rIndex}, ${mIndex}, 2, this.value)" onclick="event.stopPropagation()">
          </div>
        </div>`;
          });
          html += `</div>`;
        });

        html += `<div style="display:flex; align-items:center;">
      <button class="btn-pub" onclick="generateNextRound()" style="background:rgba(0,245,255,0.1); color:#00f5ff; border:1px dashed #00f5ff; width:120px; font-size:11px;">➕ توليد الجولة التالية</button>
    </div>`;

        html += `</div>`;
        container.innerHTML = html;
      } else if (currentTourData.type === 'league') {
        let html = `<table class="league-table">
      <thead>
        <tr><th>اللاعب</th><th>لعب</th><th>فوز</th><th>تعادل</th><th>خسارة</th><th>نقاط</th><th>إجراء</th></tr>
      </thead>
      <tbody>`;
        currentTourData.league.forEach((p, idx) => {
          html += `<tr>
        <td>${escapeHtml(p.name)}</td>
        <td><input type="number" value="${p.p}" onchange="updateLeagueStat(${idx}, 'p', this.value)"></td>
        <td><input type="number" value="${p.w}" onchange="updateLeagueStat(${idx}, 'w', this.value)"></td>
        <td><input type="number" value="${p.d}" onchange="updateLeagueStat(${idx}, 'd', this.value)"></td>
        <td><input type="number" value="${p.l}" onchange="updateLeagueStat(${idx}, 'l', this.value)"></td>
        <td><input type="number" value="${p.pts}" onchange="updateLeagueStat(${idx}, 'pts', this.value)"></td>
        <td><button class="btn-del" onclick="removeFromLeague(${idx})" style="padding:2px 8px; font-size:10px;">🗑️</button></td>
      </tr>`;
        });
        html += `</tbody></table>
    <button class="btn-pub" onclick="sortLeague()" style="margin-top:15px; width:auto; font-size:12px; background:#ffd2b8; color:#000;">🔄 ترتيب حسب النقاط</button>`;
        container.innerHTML = html;
      } else if (currentTourData.type === 'groups_bracket') {
        if (currentTourData.matches && currentTourData.matches.length > 0) {
          // عرض الشجرة بعد انتهاء المجموعات
          let html = `<h4 style="color:#ffd2b8; margin-bottom:15px;">🌳 المرحلة الإقصائية</h4><div style="display:flex; gap:40px;">`;
          currentTourData.matches.forEach((round, rIndex) => {
            html += `<div class="bracket-round"><h4 style="color:#00f5ff; font-size:12px; margin-bottom:10px;">الجولة ${rIndex + 1}</h4>`;
            round.forEach((m, mIndex) => {
              html += `<div class="match-box">
             <div class="match-p ${m.winner === m.p1?.id ? 'winner' : ''}" onclick="setMatchWinner(${rIndex}, ${mIndex}, 1)">
               <span>${escapeHtml(m.p1?.name || '???')}</span>
               <input type="number" value="${m.score1}" onchange="updateMatchScore(${rIndex}, ${mIndex}, 1, this.value)" onclick="event.stopPropagation()">
             </div>
             <div class="match-p ${m.winner === m.p2?.id ? 'winner' : ''}" onclick="setMatchWinner(${rIndex}, ${mIndex}, 2)">
               <span>${escapeHtml(m.p2?.name || '???')}</span>
               <input type="number" value="${m.score2}" onchange="updateMatchScore(${rIndex}, ${mIndex}, 2, this.value)" onclick="event.stopPropagation()">
             </div>
           </div>`;
            });
            html += `</div>`;
          });
          html += `<div style="display:flex; align-items:center;"><button class="btn-pub" onclick="generateNextRound()" style="background:rgba(0,245,255,0.1); color:#00f5ff; border:1px dashed #00f5ff; width:120px; font-size:11px;">➕ توليد الجولة التالية</button></div></div>`;
          container.innerHTML = html;
        } else {
          // عرض المجموعات
          let html = `<div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap:20px;">`;
          currentTourData.groups.forEach((g, gIdx) => {
            html += `<div class="card" style="margin:0; border:1px solid #333;">
          <h4 style="color:#ffd2b8; margin-bottom:10px;">${g.name}</h4>
          <table class="league-table" style="font-size:11px;">
            <thead><tr><th>اللاعب</th><th>لعب</th><th>فوز</th><th>ن</th><th>إجراء</th></tr></thead>
            <tbody>`;
            g.players.forEach((p, pIdx) => {
              html += `<tr>
            <td>${escapeHtml(p.name)}</td>
            <td><input type="number" value="${p.p}" style="width:30px;" onchange="updateGroupStat(${gIdx}, ${pIdx}, 'p', this.value)"></td>
            <td><input type="number" value="${p.w}" style="width:30px;" onchange="updateGroupStat(${gIdx}, ${pIdx}, 'w', this.value)"></td>
            <td><input type="number" value="${p.pts}" style="width:30px;" onchange="updateGroupStat(${gIdx}, ${pIdx}, 'pts', this.value)"></td>
            <td><button class="btn-del" onclick="removeFromGroup(${gIdx}, ${pIdx})" style="padding:2px 6px;">🗑️</button></td>
          </tr>`;
            });
            html += `</tbody></table></div>`;
          });
          html += `</div>
      <button class="btn-pub" onclick="startEliminationFromGroups()" style="margin-top:20px; background:#ff9800; color:#000; width:auto; padding:10px 25px;">🚀 إنهاء المجموعات وبدء التصفيات (الشجرة)</button>`;
          container.innerHTML = html;
        }
      }
    }

    function updateGroupStat(gIdx, pIdx, key, val) {
      currentTourData.groups[gIdx].players[pIdx][key] = parseInt(val) || 0;
    }

    function removeFromGroup(gIdx, pIdx) {
      if (!confirm('حذف هذا اللاعب من المجموعة؟')) return;
      currentTourData.groups[gIdx].players.splice(pIdx, 1);
      renderMatchView();
    }

    function removeFromLeague(idx) {
      if (!confirm('حذف هذا اللاعب من الدوري؟')) return;
      currentTourData.league.splice(idx, 1);
      renderMatchView();
    }

    function startEliminationFromGroups() {
      if (!confirm('هل انتهت مباريات المجموعات؟ سيتم تأهيل المتصدرين وبناء الشجرة الإقصائية.')) return;

      let advancers = [];
      currentTourData.groups.forEach(g => {
        // ترتيب المجموعة
        g.players.sort((a, b) => b.pts - a.pts || b.w - a.w);
        // أخذ المتأهلين
        advancers.push(...g.players.slice(0, currentTourData.advPerGroup));
      });

      if (advancers.length < 2) { alert('عدد المتأهلين قليل جداً!'); return; }

      // بناء الجولة الأولى من الشجرة
      let firstRound = [];
      for (let i = 0; i < advancers.length; i += 2) {
        firstRound.push({
          id: 'r1-m' + (i / 2),
          p1: advancers[i],
          p2: advancers[i + 1] || { name: 'BYE', id: 'bye' },
          score1: 0,
          score2: 0,
          winner: (advancers[i + 1] ? null : advancers[i].id)
        });
      }
      currentTourData.matches = [firstRound];
      renderMatchView();
    }

    function updateMatchScore(r, m, pIdx, val) {
      currentTourData.matches[r][m]['score' + pIdx] = parseInt(val) || 0;
    }

    function setMatchWinner(r, m, pIdx) {
      const match = currentTourData.matches[r][m];
      const player = match['p' + pIdx];
      if (!player || player.id === 'bye') return;
      match.winner = (match.winner === player.id) ? null : player.id;
      renderMatchView();
    }

    function generateNextRound() {
      const lastRound = currentTourData.matches[currentTourData.matches.length - 1];
      if (lastRound.length === 1 && lastRound[0].winner) {
        alert('تم تحديد الفائز بالبطولة! يمكنك الضغط على "إنهاء البطولة".');
        return;
      }

      let winners = lastRound.map(m => {
        if (m.winner === m.p1?.id) return m.p1;
        if (m.winner === m.p2?.id) return m.p2;
        return null;
      });

      if (winners.includes(null)) {
        alert('يرجى تحديد جميع الفائزين في الجولة الحالية أولاً (اضغط على اسم اللاعب الفائز).');
        return;
      }

      let nextRound = [];
      for (let i = 0; i < winners.length; i += 2) {
        nextRound.push({
          id: `r${currentTourData.matches.length + 1}-m${i / 2}`,
          p1: winners[i],
          p2: winners[i + 1] || { name: 'BYE', id: 'bye' },
          score1: 0,
          score2: 0,
          winner: (winners[i + 1] ? null : winners[i].id)
        });
      }

      currentTourData.matches.push(nextRound);
      renderMatchView();
    }

    function updateLeagueStat(idx, key, val) {
      currentTourData.league[idx][key] = parseInt(val) || 0;
    }

    function sortLeague() {
      currentTourData.league.sort((a, b) => b.pts - a.pts || (b.w - a.w));
      renderMatchView();
    }

    async function saveTournamentData() {
      try {
        const { error } = await supabaseClient.from('posts')
          .update({ content: JSON.stringify(currentTourData) })
          .eq('id', currentTourId);

        if (error) throw error;
        console.log('Saved tournament data.');
      } catch (e) {
        alert('فشل حفظ البيانات: ' + e.message);
      }
    }

    async function finishTournament() {
      if (!confirm('هل أنت متأكد من إنهاء البطولة؟ سيتم إغلاق التعديل وعرض النتائج النهائية.')) return;

      currentTourData.status = 'finished';

      if (currentTourData.type === 'bracket') {
        let rank = [];
        const lastRound = currentTourData.matches[currentTourData.matches.length - 1];
        if (lastRound[0].winner) {
          const winner = lastRound[0].winner === lastRound[0].p1.id ? lastRound[0].p1 : lastRound[0].p2;
          const loser = lastRound[0].winner === lastRound[0].p1.id ? lastRound[0].p2 : lastRound[0].p1;
          rank.push(winner);
          rank.push(loser);
        }
        currentTourData.rankings = rank;
      } else {
        sortLeague();
        currentTourData.rankings = currentTourData.league.slice(0, 5);
      }

      await saveTournamentData();
      renderTourDashboard();
    }

    function renderRankings() {
      const container = document.getElementById('tm-rankings');
      let html = `<div style="background:rgba(0,245,255,0.05); padding:20px; border-radius:12px; border:1px solid #30363d;">`;

      if (!currentTourData.rankings || currentTourData.rankings.length === 0) {
        html += `<p style="color:#888;">لم يتم تحديد فائزين بعد.</p>`;
      } else {
        currentTourData.rankings.forEach((p, idx) => {
          const icons = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];
          html += `<div class="ranking-item">
        <div class="ranking-rank">${icons[idx] || (idx + 1)}</div>
        <div class="ranking-name" style="font-weight:700;">${escapeHtml(p.name)}</div>
      </div>`;
        });
      }
      html += `</div>`;
      container.innerHTML = html;
    }

    async function reopenTournament() {
      if (!confirm('إعادة فتح البطولة؟')) return;
      currentTourData.status = 'ongoing';
      await saveTournamentData();
      renderTourDashboard();
    }

    // ==================== نظام تتبع النشاط التلقائي (بدون SQL) ====================
    async function logActivity(type) {
      try {
        const today = new Date().toISOString().split('T')[0];
        const storageKey = `virtux_last_${type}_${today}`;
        if (localStorage.getItem(storageKey)) return;

        const { data: { session } } = await supabaseClient.auth.getSession();
        const userId = session?.user?.id || null;

        let visitorId = localStorage.getItem('virtux_visitor_id');
        if (!visitorId) {
          visitorId = 'v_' + Math.random().toString(36).substring(2, 15);
          localStorage.setItem('virtux_visitor_id', visitorId);
        }

        const payload = {
          room: '_traffic',
          tag: type,
          description: today,
          title: userId || visitorId,
          user_id: userId,
          icon: '📊'
        };

        const { data: existing } = await supabaseClient.from('posts')
          .select('id').eq('room', '_traffic').eq('tag', type).eq('description', today).eq('title', payload.title).limit(1);

        if (!existing || existing.length === 0) {
          await supabaseClient.from('posts').insert(payload);
        }
        localStorage.setItem(storageKey, 'true');
      } catch (e) {
        console.debug('Traffic log skipped:', e.message);
      }
    }

    // تسجيل زيارة عند دخول لوحة التحكم
    logActivity('visit');

    function escapeHtml(str) {
      if (!str && str !== 0) return '';
      return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m] || m);
    }

    // ==================== تسجيل الدخول ====================
    async function checkConn() {
      try {
        let res = await fetch(`${SUPABASE_URL}/rest/v1/posts?limit=1`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
        let el = document.getElementById('connStatus');
        if (res.ok) { el.textContent = '✅ متصل'; el.className = 'conn'; }
        else { el.textContent = '❌ خطأ'; el.className = 'conn fail'; }
      } catch (e) {
        document.getElementById('connStatus').textContent = '❌ لا إنترنت';
        document.getElementById('connStatus').className = 'conn fail';
      }
    }

    function login() {
      if (document.getElementById('pw').value === ADMIN_PASSWORD) {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('adminPage').style.display = 'flex';
        checkConn();
        buildPages();
        showPage('dashboard');
      } else {
        document.getElementById('loginErr').style.display = 'block';
      }
    }
    function logout() { window.location.reload(); }

    // ==================== بناء الصفحات ====================
    function buildPages() {

    async function manualMigrateReels() {
      if (!confirm('هل تريد نقل جميع الفيديوهات القصيرة (Shorts/Reels) من غرفة الفيديوهات إلى الغرفة الجديدة؟\n(سيتم فحص مدة الفيديوهات لضمان الدقة)')) return;
      try {
        const { data: posts } = await supabaseClient.from('posts').select('id,url,tag').eq('room', 'yt-videos');
        if (!posts || posts.length === 0) { alert('ℹ️ لا توجد فيديوهات في غرفة الفيديوهات لنقلها.'); return; }

        let toMigrate = [];
        let processed = 0;

        // فحص الفيديوهات على دفعات من 50 (سعة الـ API لطلب واحد)
        for (let i = 0; i < posts.length; i += 50) {
          const batch = posts.slice(i, i + 50);
          const vIds = batch.map(p => {
            const m = p.url.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
            return m ? m[1] : null;
          }).filter(Boolean);

          if (vIds.length > 0) {
            const durations = await fetchDurations(vIds);
            batch.forEach(p => {
              const vid = p.url.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/)?.[1];
              const isShortByDur = vid && durations[vid];
              const t = (p.tag || '').toLowerCase();
              const u = (p.url || '').toLowerCase();
              const isShortByText = t.includes('reel') || t.includes('short') || u.includes('shorts');

              if (isShortByDur || isShortByText) {
                toMigrate.push(p.id);
              }
            });
          }
          processed += batch.length;
          console.log(`⏳ جاري فحص الفيديوهات: ${processed}/${posts.length}...`);
        }

        if (toMigrate.length > 0) {
          const { error } = await supabaseClient.from('posts').update({ room: 'reels', tag: 'Reel' }).in('id', toMigrate);
          if (error) throw error;
          alert(`✅ تم نقل ${toMigrate.length} فيديو إلى غرفة الـ Reels بنجاح.`);
          loadDashboard();
        } else {
          alert('ℹ️ لم يتم العثور على فيديوهات مطابقة (قصيرة) لنقلها.');
        }
      } catch (e) {
        alert('❌ فشل النقل: ' + e.message);
      }
    }

    function toggleAllCheckboxes(room, checked) {

    }

    async function deleteSelectedPosts(room, page = 1) {
      const checkboxes = document.querySelectorAll(`.post-checkbox-${room}:checked`);
      const ids = Array.from(checkboxes).map(cb => parseInt(cb.value));
      if (ids.length === 0) { alert('يرجى تحديد منشورات أولاً'); return; }
      if (!confirm(`هل أنت متأكد من حذف ${ids.length} منشور؟`)) return;
      try {
        if (room === 'yt-videos' || room === 'live') {
          let { data: channels } = await supabaseClient.from('posts').select('title').eq('room', 'yt-channels');
          let trackedNames = (channels || []).map(c => c.title);
          let { data: postsToDelete } = await supabaseClient.from('posts').select('id, description').in('id', ids);

          let toSoftDelete = [];
          let toPermanentDelete = [];
          (postsToDelete || []).forEach(p => {
            if (trackedNames.includes(p.description)) toSoftDelete.push(p.id);
            else toPermanentDelete.push(p.id);
          });

          if (toSoftDelete.length > 0) await supabaseClient.from('posts').update({ room: '_trash' }).in('id', toSoftDelete);
          if (toPermanentDelete.length > 0) await supabaseClient.from('posts').delete().in('id', toPermanentDelete);

          alert(`✅ تم الحذف: ${toSoftDelete.length} للمهملات و ${toPermanentDelete.length} نهائياً`);
        } else {
          await supabaseClient.from('posts').delete().in('id', ids);
          alert(`✅ تم حذف ${ids.length} منشور نهائياً`);
        }
        loadContentPage(room, page);
        loadDashboard();
      } catch (e) { alert('❌ فشل الحذف الجماعي: ' + e.message); }
    }

    async function deleteByChannelName(room, page = 1) {
      const channelName = document.getElementById(`channelFilter-${room}`).value.trim();
      if (!channelName) { alert('يرجى إدخال اسم اليوتيوبر / القناة'); return; }
      if (!confirm(`هل أنت متأكد من حذف جميع محتويات "${channelName}"؟`)) return;
      try {
        await supabaseClient.from('posts').update({ room: '_trash' }).eq('room', room).eq('description', channelName);

        loadContentPage(room, page);
        loadDashboard();
      } catch (e) { alert('❌ فشل الحذف: ' + e.message); }
    }

    let _searchTimeout = null;
    async function searchPostsInRoom(room, query) {
      if (_searchTimeout) clearTimeout(_searchTimeout);
      _searchTimeout = setTimeout(async () => {
        let container = document.getElementById(`content-${room}`);
        let postListContainer = container.querySelector('.posts-list');
        if (!postListContainer) return;

        try {
          let queryBuilder = supabaseClient.from('posts').select('*').eq('room', room).order('id', { ascending: false });
          if (query.trim()) {
            queryBuilder = queryBuilder.ilike('title', `%${query.trim()}%`);
          } else {
            queryBuilder = queryBuilder.limit(50);
          }

          let { data: posts, error } = await queryBuilder;
          if (error) throw error;

          if (!posts || !posts.length) {
            postListContainer.innerHTML = '<div class="empty">لا توجد نتائج بحث.</div>';
            return;
          }

          postListContainer.innerHTML = posts.map(p => {
            if (room === 'yt-channels') {
              let avatar = (p.icon && (p.icon.startsWith('http') || p.icon.startsWith('data:'))) ? `<img class="channel-avatar-admin" src="${p.icon}">` : `<div class="channel-avatar-admin" style="background:#1a2d80; display:flex; align-items:center; justify-content:center;">📺</div>`;
              return `<div class="channel-card-admin">
            <input type="checkbox" class="post-checkbox-${room}" value="${p.id}" style="width:18px; height:18px; cursor:pointer;">
            ${avatar}
            <div class="channel-info-admin">
              <div class="channel-name-admin">${escapeHtml(p.title)}</div>
              <div class="channel-sub-admin">${escapeHtml(p.description || '')}</div>
              <a href="${p.url}" target="_blank" class="channel-link-admin">زيارة القناة</a>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="btn-edit" onclick="openEditModal(${p.id})">✏️</button>
              <button class="btn-del" onclick="deletePost(${p.id},'${room}')">🗑️</button>
            </div>
          </div>`;
            } else {
              let media = '';
              const isVideo = p.url && (p.url.match(/\.(mp4|webm|avi|mov|mkv|flv|wmv|m4v|mpg|mpeg|3gp)$/i) || p.url.includes('/storage/v1/object/public/videos/'));
              const isYouTube = p.url && (p.url.includes('youtube.com/watch') || p.url.includes('youtu.be'));
              const isImage = p.url && p.url.match(/\.(jpeg|jpg|gif|png|webp|svg|bmp)$/i);
              if (isVideo) media = `<video src="${p.url}" controls style="width:80px; height:60px; object-fit:cover; border-radius:6px;"></video>`;
              else if (isYouTube) { let vid = p.url.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/)?.[1]; media = vid ? `<img src="https://img.youtube.com/vi/${vid}/default.jpg" style="width:80px; height:60px; object-fit:cover;">` : `<div class="pi-icon">${p.icon || '📹'}</div>`; }
              else if (isImage) media = `<img src="${p.url}" style="width:80px; height:60px; border-radius:6px; object-fit:cover;">`;
              else if (p.icon && (p.icon.startsWith('data:') || p.icon.startsWith('http'))) media = `<img src="${p.icon}" style="width:40px; height:40px; border-radius:6px; object-fit:cover;">`;
              else media = `<div class="pi-icon">${p.icon || '📄'}</div>`;
              return `<div class="pi" id="pi-${p.id}">
            <input type="checkbox" class="post-checkbox-${room}" value="${p.id}" style="width:18px; height:18px; cursor:pointer; margin-right:5px;">
            <div style="width:80px; flex-shrink:0;">${media}</div>
            <div class="pi-info">
              <div class="pi-title">${escapeHtml(p.title)}</div>
              <div class="pi-meta">${(room === 'yt-videos' || room === 'live') ? '' : escapeHtml(p.description || '') + ' • '}${p.tag || ''}</div>
              <span class="pi-tag">${escapeHtml(p.tag || p.room)}</span>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="btn-edit" onclick="openEditModal(${p.id})">✏️ تعديل</button>

    // ==================== دوال مساعدة للمعاينة والإضافة ====================
    function previewImg(room) {
      let file = document.getElementById(`imgfile-${room}`).files[0];
      if (!file) return;
      let reader = new FileReader();
      reader.onload = e => {
        let preview = document.getElementById(`preview-${room}`);
        if (preview) {
          preview.src = e.target.result;
          preview.style.display = 'block';
        }
        const iconField = document.getElementById(`icon-${room}`);
        if (iconField) {
          iconField.value = '🖼️';
          iconField._imgData = e.target.result;
        }
      };
      reader.readAsDataURL(file);
    }

    function clearMedia(room) {
      if (room !== 'highlights' && room !== 'home' && room !== 'projects' && room !== 'gaming-news' && room !== 'youtube-news' && room !== 'live' && room !== 'tournaments') return;
      const previewImg = document.getElementById(`preview-img-${room}`);
      const previewVideo = document.getElementById(`preview-video-${room}`);
      const previewText = document.getElementById(`preview-text-${room}`);
      if (previewImg) previewImg.style.display = 'none';
      if (previewVideo) previewVideo.style.display = 'none';
      if (previewText) previewText.style.display = 'block';
      document.getElementById(`url-${room}`).value = '';
      document.getElementById(`icon-${room}`).value = '';
      document.getElementById(`imgfile-${room}`).value = '';
      document.getElementById(`videofile-${room}`).value = '';
      delete document.getElementById(`icon-${room}`)._imgData;
    }
    function handleImageUpload(room) {
      const fileInput = document.getElementById(`imgfile-${room}`);
      const file = fileInput?.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const previewImg = document.getElementById(`preview-img-${room}`);
        const previewVideo = document.getElementById(`preview-video-${room}`);
        const previewText = document.getElementById(`preview-text-${room}`);
        if (previewImg) { previewImg.src = e.target.result; previewImg.style.display = 'block'; }
        if (previewVideo) previewVideo.style.display = 'none';
        if (previewText) previewText.style.display = 'none';
        const iconField = document.getElementById(`icon-${room}`);
        iconField.value = '🖼️';
        iconField._imgData = e.target.result;
        document.getElementById(`url-${room}`).value = '';
      };
      reader.readAsDataURL(file);
    }
    async function uploadVideoToBucket(room) {
      let fileInput = document.getElementById(`videofile-${room}`);
      let file = fileInput?.files[0];
      if (!file) { alert('لم تختر ملفاً'); return; }
      if (!file.type.startsWith('video/')) { alert('الملف المختار ليس فيديو'); return; }
      let fileName = Date.now() + '_' + file.name;
      fileName = fileName.replace(/\s/g, '_').replace(/[^a-zA-Z0-9._-]/g, '');
      let filePath = `highlights/${fileName}`;
      let uploadUrl = `${SUPABASE_URL}/storage/v1/object/videos/${filePath}`;
      let btn = document.querySelector(`#ap-${room} .btn-pub`);
      if (btn) btn.disabled = true;
      try {
        let res = await fetch(uploadUrl, { method: 'POST', headers: { 'Authorization': `Bearer ${SUPABASE_KEY}` }, body: file });
        if (res.ok) {
          let publicUrl = `${SUPABASE_URL}/storage/v1/object/public/videos/${filePath}`;
          document.getElementById(`url-${room}`).value = publicUrl;
          let titleField = document.getElementById(`title-${room}`);
          if (titleField && !titleField.value.trim()) titleField.value = file.name.replace(/\.[^/.]+$/, '');
          const previewImg = document.getElementById(`preview-img-${room}`);
          const previewVideo = document.getElementById(`preview-video-${room}`);
          const previewText = document.getElementById(`preview-text-${room}`);
          if (previewImg) previewImg.style.display = 'none';
          if (previewVideo) { previewVideo.src = publicUrl; previewVideo.style.display = 'block'; }
          if (previewText) previewText.style.display = 'none';
          document.getElementById(`icon-${room}`).value = '';
          delete document.getElementById(`icon-${room}`)._imgData;
          alert('✅ تم رفع الفيديو! الرابط جاهز.');
        } else { let errText = await res.text(); alert('❌ فشل الرفع: ' + errText); }
      } catch (e) { alert('خطأ: ' + e.message); }
      finally { if (btn) btn.disabled = false; }
    }
    async function addPost(room) {
      const titleEl = document.getElementById(`title-${room}`);
      const urlEl = document.getElementById(`url-${room}`);
      const descEl = document.getElementById(`desc-${room}`);
      const contentEl = document.getElementById(`content-${room}`);
      const iconEl = document.getElementById(`icon-${room}`);
      const tagEl = document.getElementById(`tag-${room}`);
      function getSafeValue(el) { if (!el) return ''; if (el.value === undefined) return ''; return (el.value || '').trim(); }
      let title = getSafeValue(titleEl);
      let url = getSafeValue(urlEl);
      let desc = getSafeValue(descEl);
      let content = getSafeValue(contentEl);
      let icon = getSafeValue(iconEl);
      let tag = tagEl ? tagEl.value : room;

      // دعم البطولات
      if (room === 'tournaments') {
        const regCb = document.getElementById(`reg-enabled-${room}`);
        if (regCb && regCb.checked) tag += ':reg';
        const dlCb = document.getElementById(`dl-enabled-${room}`);
        if (dlCb && dlCb.checked) tag += ':dl';
      }
      let imgData = iconEl?._imgData || '';
      if (imgData) icon = imgData;
      const hasImage = (icon && (icon.startsWith('data:') || icon.startsWith('http'))) || (url && url.match(/\.(jpg|jpeg|png|gif|webp)$/i));
      const hasVideo = url && (url.match(/\.(mp4|webm|avi|mov|mkv|flv|wmv|m4v|mpg|mpeg|3gp)$/i) || url.includes('/storage/v1/object/public/videos/') || url.includes('youtube.com') || url.includes('youtu.be'));
      if (room === 'highlights') {
        if (tag === 'Photo') { if (!hasImage) { showError(room, '❌ عند اختيار "صورة"، يجب رفع صورة أو إضافة رابط صورة.'); return; } }
        else if (tag === 'Video') { if (!hasVideo) { showError(room, '❌ عند اختيار "فيديو"، يجب رفع فيديو أو إضافة رابط يوتيوب.'); return; } }
        else { if (!hasImage && !hasVideo) { showError(room, '❌ في Pro / Tournament، يجب رفع صورة أو فيديو.'); return; } }
      } else if (room === 'home') {
        if (tag === 'Photo') { if (!hasImage) { showError(room, '❌ يجب رفع صورة أو إضافة رابط صورة.'); return; } }
        else if (tag === 'Video') { if (!hasVideo) { showError(room, '❌ يجب رفع فيديو أو إضافة رابط يوتيوب.'); return; } }
        else { if (!title && !desc && !content && !url && !icon) { showError(room, '❌ المقال فارغ. أدخل عنواناً أو محتوى.'); return; } }
      } else if (room === 'projects') {
        if (tag === 'Photo') { if (!hasImage) { showError(room, '❌ يجب رفع صورة أو إضافة رابط صورة.'); return; } }
        else if (tag === 'Video') { if (!hasVideo) { showError(room, '❌ يجب رفع فيديو أو إضافة رابط يوتيوب.'); return; } }
        else { if (!title && !url && !icon && !content) { showError(room, '❌ المشروع فارغ. أدخل عنواناً أو وسائط.'); return; } }
      } else if (room === 'gaming-news' || room === 'youtube-news' || room === 'live' || room === 'tournaments') {
        if (tag === 'Photo') { if (!hasImage) { showError(room, '❌ يجب رفع صورة أو إضافة رابط صورة.'); return; } }
        else if (tag === 'Video') { if (!hasVideo) { showError(room, '❌ يجب رفع فيديو أو إضافة رابط يوتيوب.'); return; } }
        else { if (!title && !desc && !content && !url && !icon) { showError(room, '❌ المنشور فارغ. أدخل عنواناً أو محتوى.'); return; } }
      } else {
        if (!title && !url && !icon) { showError(room, '❌ المنشور فارغ. أدخل عنواناً أو رابطاً أو صورة.'); return; }
      }
      if (!title && (url || icon)) title = room === 'highlights' ? '🎬 مقطع' : (room === 'home' ? '📄 مقال' : (room === 'projects' ? '🌐 مشروع' : (room === 'gaming-news' ? '📰 خبر' : (room === 'youtube-news' ? '▶️ خبر' : (room === 'live' ? '🔴 بث' : (room === 'tournaments' ? '🏆 بطولة' : '📄 منشور'))))));
      const body = { title, description: desc, icon: icon || '📄', url, tag, room, content };
      const btn = document.querySelector(`#ap-${room} .btn-pub`);
      if (btn) btn.disabled = true;
      try {
        const { error } = await supabaseClient.from('posts').insert(body);
        if (error) throw error;
        const okDiv = document.getElementById(`ok-${room}`);
        if (okDiv) { okDiv.style.display = 'block'; setTimeout(() => okDiv.style.display = 'none', 2000); }
        if (titleEl) titleEl.value = '';
        if (descEl) descEl.value = '';
        if (urlEl) urlEl.value = '';
        if (iconEl) iconEl.value = '';
        if (contentEl) contentEl.value = '';
        const fileInput = document.getElementById(`imgfile-${room}`);
        if (fileInput) fileInput.value = '';
        const videoInput = document.getElementById(`videofile-${room}`);
        if (videoInput) videoInput.value = '';
        const previewImg = document.getElementById(`preview-img-${room}`);
        const previewVideo = document.getElementById(`preview-video-${room}`);
        const previewText = document.getElementById(`preview-text-${room}`);
        if (previewImg) previewImg.style.display = 'none';
        if (previewVideo) previewVideo.style.display = 'none';
        if (previewText) previewText.style.display = 'block';
        loadContentPage(room);
        loadDashboard();
      } catch (e) { showError(room, e.message); }
      finally { if (btn) btn.disabled = false; }
    }
    function showError(room, msg) { let er = document.getElementById(`er-${room}`); if (er) { er.textContent = msg; er.style.display = 'block'; setTimeout(() => er.style.display = 'none', 4000); } else alert(msg); }
    async function deletePost(id, room, page = 1) {
      if (!confirm('هل أنت متأكد من الحذف؟')) return;

      // إخفاء العنصر فوراً من الشاشة ليعطي شعوراً بالحذف الفوري
      const el = document.getElementById(`pi-${id}`) || document.getElementById(`user-${id}`) || document.querySelector(`[value="${id}"]`)?.closest('.channel-card-admin');
      if (el) el.style.display = 'none';

      try {
        let { data: post, error: fetchErr } = await supabaseClient.from('posts').select('*').eq('id', id).single();
        if (fetchErr || !post) {
          alert('⚠️ لم يتم العثور على العنصر في قاعدة البيانات، ربما تم حذفه بالفعل.');
          loadContentPage(room, page);
          return;
        }

        if (room === 'yt-channels') {
          const channelTitle = post.title.trim();
          console.log(`🧹 جاري تنظيف محتويات القناة: ${channelTitle}`);

          // 1. حذف الفيديوهات المرتبطة بالاسم (للفيديوهات القديمة)
          await supabaseClient.from('posts').delete().eq('description', channelTitle).in('room', ['yt-videos', 'live', '_trash']);

          // 2. حذف الفيديوهات المرتبطة بالـ ID (للفيديوهات الجديدة)
          await supabaseClient.from('posts').delete().eq('tag', `auto:${id}`).in('room', ['yt-videos', 'live', '_trash']);

          // 3. حذف القناة نفسها
          const { error } = await supabaseClient.from('posts').delete().eq('id', id);
          if (error) throw error;

          alert(`✅ تم حذف القناة "${channelTitle}" وجميع محتوياتها بنجاح.`);
        } else if (room === 'yt-videos' || room === 'live') {
          // التحقق إذا كانت القناة مراقبة
          let { data: ch } = await supabaseClient.from('posts').select('id').eq('room', 'yt-channels').eq('title', post.description).limit(1);

          if (ch && ch.length > 0) {
            // نقل للمهملات
            const { error } = await supabaseClient.from('posts').update({ room: '_trash' }).eq('id', id);
            if (error) throw error;
            // حذف أي تكرارات لنفس الرابط في هذه الغرفة لضمان نظافة القائمة
            if (post.url) await supabaseClient.from('posts').delete().eq('url', post.url).eq('room', room).neq('id', id);
            alert('✅ تم النقل للمهملات.');
          } else {
            // حذف نهائي
            const { error } = await supabaseClient.from('posts').delete().eq('id', id);
            if (error) throw error;
            alert('✅ تم الحذف نهائياً.');
          }
        } else {
          // غرف أخرى حذف نهائي
          const { error } = await supabaseClient.from('posts').delete().eq('id', id);
          if (error) throw error;
          alert('✅ تم الحذف نهائياً.');
        }

        await loadContentPage(room, page);
        loadDashboard();
      } catch (e) {
        console.error('Delete process failed:', e);
        alert('❌ خطأ أثناء الحذف: ' + e.message);
        if (el) el.style.display = 'flex';
      }
    }

    // ==================== إدارة سلة المحذوفات (Trash) ====================
    async function loadTrashRoom(page = 1) {
      trashPage = page;
      let container = document.getElementById('content-trash');
      if (!container) return;
      container.innerHTML = '<div class="loading">جاري تحميل المهملات...</div>';
      try {
        const from = (trashPage - 1) * trashPageSize;
        const to = from + trashPageSize - 1;

        let { data: trashPosts, count, error } = await supabaseClient.from('posts')
          .select('*', { count: 'exact' })
          .eq('room', '_trash')
          .order('id', { ascending: false })
          .range(from, to);

        if (error) throw error;

        let html = `<div class="card" style="border-color:#ffaa00;">
      <h3>🗑️ فيديوهات في المهملات (يمنع البوت من إعادتها)</h3>
      <p style="font-size:12px; color:#888; margin-bottom:12px;">ملاحظة: الفيديوهات هنا لن تظهر في الموقع، ولكن وجودها يمنع البوت من جلبها مرة أخرى. إذا حذفتها من هنا نهائياً، قد يعيد البوت جلبها.</p>
      
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.05);">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:#ffaa00;">
          <input type="checkbox" id="selectAllTrash" onchange="toggleSelectAllTrash(this.checked)" style="width:16px; height:16px;">
          تحديد الكل في هذه الصفحة
        </label>
        <div style="display:flex; gap:8px;">
          <button class="btn-pub" style="background:#4caf90; padding:6px 14px; font-size:12px;" onclick="restoreSelectedTrash()">⏪ استعادة المحدد</button>
          <button class="btn-del" style="padding:6px 14px; font-size:12px;" onclick="hardDeleteSelectedTrash()">🔥 حذف المحدد نهائياً</button>
        </div>
      </div>
    </div>`;

        if (!trashPosts || trashPosts.length === 0) {
          html += '<div class="empty">سلة المهملات فارغة.</div>';
        } else {
          html += `<div class="posts-list">` + trashPosts.map(p => {
            let vid = p.url?.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/)?.[1];
            let media = vid ? `<img src="https://img.youtube.com/vi/${vid}/default.jpg" style="width:80px; height:60px; object-fit:cover; border-radius:6px;">` : `<div class="pi-icon">📹</div>`;
            return `<div class="pi" id="trash-item-${p.id}">
          <div style="display:flex; align-items:center; gap:12px; flex:1;">
            <input type="checkbox" class="trash-checkbox" value="${p.id}" style="width:18px; height:18px;">
            <div style="width:80px; flex-shrink:0;">${media}</div>
            <div class="pi-info">
              <div class="pi-title">${escapeHtml(p.title)}</div>
              <div class="pi-meta">${escapeHtml(p.description || '')} • ${p.tag || ''}</div>
            </div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn-pub" style="background:#4caf90; padding:6px 12px; font-size:11px;" onclick="restorePost(${p.id})">⏪ استعادة</button>
            <button class="btn-del" style="padding:6px 12px; font-size:11px;" onclick="hardDeletePost(${p.id})">🔥 حذف</button>
          </div>
        </div>`;
          }).join('') + `</div>`;

          // Pagination
          const totalPages = Math.ceil(count / trashPageSize);
          if (totalPages > 1) {
            html += `<div style="display:flex; justify-content:center; gap:8px; margin-top:20px;">`;
            for (let i = 1; i <= totalPages; i++) {
              const active = i === trashPage ? 'background:#ffaa00; color:#000;' : 'background:rgba(255,255,255,0.05); color:#fff;';
              html += `<button onclick="loadTrashRoom(${i})" style="${active} border:1px solid rgba(255,255,255,0.1); padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:bold;">${i}</button>`;
            }
            html += `</div>`;
          }
        }
        container.innerHTML = html;
      } catch (e) { container.innerHTML = '<div class="empty">خطأ في تحميل المهملات</div>'; console.error(e); }
    }

    function toggleSelectAllTrash(checked) {
      document.querySelectorAll('.trash-checkbox').forEach(cb => cb.checked = checked);
    }

    async function getSelectedTrashIds() {
      return Array.from(document.querySelectorAll('.trash-checkbox:checked')).map(cb => parseInt(cb.value));
    }

    async function restoreSelectedTrash() {
      const ids = await getSelectedTrashIds();
      if (ids.length === 0) return alert('يرجى تحديد فيديوهات أولاً');
      if (!confirm(`هل تريد استعادة ${ids.length} فيديو إلى الموقع؟`)) return;
      try {
        await supabaseClient.from('posts').update({ room: 'yt-videos' }).in('id', ids);
        alert(`✅ تم استعادة ${ids.length} فيديو بنجاح.`);
        loadTrashRoom(trashPage);
      } catch (e) { alert('خطأ: ' + e.message); }
    }

    async function hardDeleteSelectedTrash() {
      const ids = await getSelectedTrashIds();
      if (ids.length === 0) return alert('يرجى تحديد فيديوهات أولاً');

    // ==================== دوال يوتيوب والمستخدمين ====================
    function parseYouTubeUrl(url) {
      if (!url) return null;
      url = url.trim();

      // handle مباشر @username
      if (url.startsWith('@')) return { type: 'handle', value: url.split(/[\/?]/)[0] };

      // UC... channel ID مباشر
      if (/^UC[\w-]{20,}$/.test(url)) return { type: 'id', value: url };

      // youtube.com/@ أو youtu.be/@
      if (url.includes('@')) {
        let h = url.split('@')[1]?.split(/[\/?&]/)[0];
        if (h) return { type: 'handle', value: '@' + h };
      }
      // /channel/UCxxx
      if (url.includes('/channel/')) {
        let id = url.split('/channel/')[1]?.split(/[\/?&]/)[0];
        if (id) return { type: 'id', value: id };
      }
      // /user/name
      if (url.includes('/user/')) {
        let user = url.split('/user/')[1]?.split(/[\/?&]/)[0];
        if (user) return { type: 'user', value: user };
      }
      // /c/name
      if (url.includes('/c/')) {
        let c = url.split('/c/')[1]?.split(/[\/?&]/)[0];
        if (c) return { type: 'query', value: c };
      }
      // youtube.com/CUSTOMNAME => جرّب كـ query (يمكن أن يكون handle أو username)
      try {
        const u = new URL(url.startsWith('http') ? url : 'https://' + url);
        const parts = u.pathname.replace(/^\//, '').split('/');
        if (parts[0] && parts[0] !== 'watch' && parts[0] !== 'shorts' && parts[0] !== 'playlist') {
          return { type: 'query', value: parts[0] };
        }
      } catch (e) { }

      // إذا لم يكن رابطاً بل مجرد اسم قناة
      if (!url.includes('/') && !url.includes('.')) {
        return { type: 'query', value: url };
      }

      return null;
    }

    async function fetchYouTubeChannelInfo(url) {
      try {
        let parsed = parseYouTubeUrl(url);
        if (!parsed) return null;

        const fetchByParam = async (paramStr) => {
          let apiUrl = `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&${paramStr}&key=${YOUTUBE_API_KEY}`;
          let res = await fetch(apiUrl);
          let data = await res.json();
          return data.items && data.items[0] ? data.items[0] : null;
        };

        let item = null;
        if (parsed.type === 'id') item = await fetchByParam(`id=${parsed.value}`);
        else if (parsed.type === 'handle') item = await fetchByParam(`forHandle=${parsed.value}`);
        else if (parsed.type === 'user') {
          item = await fetchByParam(`forUsername=${parsed.value}`);
          if (!item) item = await fetchByParam(`forHandle=@${parsed.value}`);
        } else if (parsed.type === 'query') {
          item = await fetchByParam(`forHandle=@${parsed.value}`);
          if (!item) item = await fetchByParam(`forUsername=${parsed.value}`);
        }

        // Fallback: search API إذا لم يجد القناة بالمعرفات السابقة
        if (!item) {
          console.log('[YT] Using search fallback for:', parsed.value || url);
          let searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&q=${encodeURIComponent(parsed.value || url)}&maxResults=1&key=${YOUTUBE_API_KEY}`;
          let searchRes = await fetch(searchUrl);
          let searchData = await searchRes.json();
          if (searchData.items && searchData.items[0]) {
            item = await fetchByParam(`id=${searchData.items[0].snippet.channelId}`);
          }
        }

        if (item) {
          return {
            title: item.snippet.title,
            subscribers: item.statistics.subscriberCount?.toLocaleString() || '0',
            thumbnail: item.snippet.thumbnails?.high?.url,
            channelId: item.id,
            uploadsPlaylistId: item.contentDetails?.relatedPlaylists?.uploads
          };
        }

        console.error('[YT] API could not find channel info.');
        return null;
      } catch (e) { console.error('[YT] Exception:', e); return null; }
    }

    // ══════════════════════════════════════════════════════════════════
    // 🔄 AUTO-FETCH ENGINE — فيديوهات + بث مباشر + قبل البث
    // ══════════════════════════════════════════════════════════════════

    async function getChannelId(parsed) {
      try {
        const fetchByParam = async (paramStr) => {
          let res = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=id,snippet,contentDetails&${paramStr}&key=${YOUTUBE_API_KEY}`);
          let d = await res.json();
          return d.items?.[0] || null;
        };

        let item = null;
        if (parsed.type === 'id') item = await fetchByParam(`id=${parsed.value}`);
        else if (parsed.type === 'handle') item = await fetchByParam(`forHandle=${parsed.value}`);
        else if (parsed.type === 'user') {
          item = await fetchByParam(`forUsername=${parsed.value}`);
          if (!item) item = await fetchByParam(`forHandle=@${parsed.value}`);
        } else if (parsed.type === 'query') {
          item = await fetchByParam(`forHandle=@${parsed.value}`);
          if (!item) item = await fetchByParam(`forUsername=${parsed.value}`);
        }

        if (!item) {
          let searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&q=${encodeURIComponent(parsed.value)}&maxResults=1&key=${YOUTUBE_API_KEY}`;
          let searchRes = await fetch(searchUrl);
          let searchData = await searchRes.json();
          if (searchData.items && searchData.items[0]) {
            item = await fetchByParam(`id=${searchData.items[0].snippet.channelId}`);
          }
        }

        if (item) return {
          id: item.id,
          title: item.snippet.title,
          uploadsId: item.contentDetails?.relatedPlaylists?.uploads
        };
      } catch (e) { }
      return null;
    }


    // جلب آخر فيديوهات عادية بطريقة موفرة جداً (1 كريدي بدلاً من 100)
    async function fetchLatestVideos(playlistId, maxResults = 5) {
      try {
        // التكلفة: 1 كريدي فقط
        let res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${playlistId}&maxResults=${maxResults}&key=${YOUTUBE_API_KEY}`);
        let d = await res.json();
        if (!d.items) return [];
        return d.items.map(v => ({
          videoId: v.snippet.resourceId.videoId,
          title: v.snippet.title,
          description: v.snippet.description || '', // إضافة الوصف
          channelName: v.snippet.channelTitle,
          thumbnail: v.snippet.thumbnails?.high?.url || '',
          publishedAt: v.snippet.publishedAt,
          videoUrl: `https://www.youtube.com/watch?v=${v.snippet.resourceId.videoId}`,
          type: 'video'
        }));
      } catch (e) { console.error('fetchLatestVideos error:', e); return []; }
    }

    // جلب الأنشطة (بث مباشر + قادم) بطريقة موفرة جداً (1 كريدي بدلاً من 200)
    async function fetchActivities(channelId) {
      try {
        let res = await fetch(`https://www.googleapis.com/youtube/v3/activities?part=snippet,contentDetails&channelId=${channelId}&maxResults=5&key=${YOUTUBE_API_KEY}`);
        let d = await res.json();
        if (!d.items) return [];

        return d.items
          .filter(item => item.snippet.type === 'liveStreaming')
          .map(item => {
            const vid = item.contentDetails.liveStreaming.videoId;
            const title = item.snippet.title;
            // تحديد النوع (قادم أم مباشر) بناءً على العنوان أو البيانات المتاحة
            let type = 'live';
            if (title.toLowerCase().includes('upcoming') || title.toLowerCase().includes('waiting')) type = 'upcoming';

            return {
              videoId: vid,
              title: title,
              channelName: item.snippet.channelTitle,
              thumbnail: item.snippet.thumbnails?.high?.url || '',
              publishedAt: item.snippet.publishedAt,
              videoUrl: `https://www.youtube.com/watch?v=${vid}`,
              type: type
            };
          });
      } catch (e) { console.error('fetchActivities error:', e); return []; }
    }

    // جلب بث مباشر فعلي (تكلفة: 1 كريدي)
