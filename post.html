<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtux - قراءة المقال</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#060810;--bg2:#0c0f1a;--bg3:#111525;
      --border:rgba(99,102,241,0.18);--border2:rgba(99,102,241,0.35);
      --accent:#6366f1;--accent2:#818cf8;--accent3:#c084fc;
      --gold:#f59e0b;--red:#ef4444;--green:#22c55e;
      --text:#e2e8f0;--text2:#94a3b8;--text3:#475569;
      --card:rgba(12,15,26,0.9);--glow:0 0 32px rgba(99,102,241,0.2);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:'Tajawal',sans-serif;
      background:var(--bg);color:var(--text);
      min-height:100vh;position:relative;
    }
    body::before{
      content:'';position:fixed;inset:0;
      background:
        radial-gradient(ellipse 70% 50% at 20% 10%,rgba(99,102,241,0.1) 0%,transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 80%,rgba(192,132,252,0.07) 0%,transparent 50%);
      pointer-events:none;z-index:0;
    }
    body::after{
      content:'';position:fixed;inset:0;
      background-image:
        linear-gradient(rgba(99,102,241,0.03) 1px,transparent 1px),
        linear-gradient(90deg,rgba(99,102,241,0.03) 1px,transparent 1px);
      background-size:44px 44px;pointer-events:none;z-index:0;
    }

    /* NAV */
    nav{
      position:fixed;top:0;left:0;right:0;z-index:100;
      background:rgba(6,8,16,0.94);backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
      padding:0 24px;height:60px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .logo{
      font-family:'Orbitron',monospace;font-size:20px;font-weight:900;
      background:linear-gradient(135deg,var(--accent2),var(--accent3));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      letter-spacing:3px;text-decoration:none;
    }
    .nav-back{
      display:flex;align-items:center;gap:6px;
      padding:6px 14px;border-radius:8px;
      background:rgba(99,102,241,0.08);border:1px solid var(--border2);
      color:var(--accent2);text-decoration:none;font-size:13px;
      cursor:pointer;border:none;transition:all 0.2s;
      font-family:'Tajawal',sans-serif;
    }
    .nav-back:hover{background:rgba(99,102,241,0.18);color:var(--text);}

    /* MAIN */
    .main-wrap{
      position:relative;z-index:1;
      max-width:820px;margin:0 auto;
      padding:84px 20px 40px;
    }

    /* BREADCRUMB */
    .breadcrumb{
      display:flex;align-items:center;gap:6px;
      font-size:12px;color:var(--text3);margin-bottom:20px;
    }
    .breadcrumb a{color:var(--accent2);text-decoration:none;}
    .breadcrumb a:hover{text-decoration:underline;}
    .breadcrumb span{color:var(--text3);}

    /* ARTICLE CARD */
    .article-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      backdrop-filter:blur(16px);
      box-shadow:0 24px 60px rgba(0,0,0,0.35);
    }

    /* MEDIA */
    .media-wrap{
      width:100%;
      background:linear-gradient(135deg,rgba(99,102,241,0.1),rgba(192,132,252,0.07));
      border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      min-height:280px;max-height:520px;overflow:hidden;
      position:relative;
    }
    .media-wrap img{
      width:100%;max-height:520px;object-fit:cover;
      display:block;opacity:0.9;
    }
    .media-emoji{font-size:90px;filter:drop-shadow(0 8px 20px rgba(0,0,0,0.4));}
    .media-wrap iframe,.media-wrap video{
      width:100%;aspect-ratio:16/9;
      border:none;display:block;
    }

    /* CONTENT */
    .article-content{padding:28px 30px;}

    /* TAG + META */
    .article-tag{
      display:inline-flex;align-items:center;gap:5px;
      padding:3px 10px;border-radius:12px;
      font-size:12px;font-weight:700;margin-bottom:14px;
      background:rgba(99,102,241,0.12);
      color:var(--accent2);
      border:1px solid rgba(99,102,241,0.2);
    }
    .article-title{
      font-size:28px;font-weight:900;
      color:var(--text);line-height:1.3;margin-bottom:14px;
    }
    .article-meta{
      display:flex;align-items:center;gap:14px;flex-wrap:wrap;
      font-size:12px;color:var(--text3);
      padding-bottom:18px;margin-bottom:20px;
      border-bottom:1px solid var(--border);
    }
    .article-meta span{display:flex;align-items:center;gap:4px;}

    /* BODY TEXT */
    .article-body{
      font-size:16px;line-height:2;color:var(--text2);
    }
    .article-body p{margin-bottom:16px;}
    .article-body strong{color:var(--text);}

    /* EXTERNAL LINK */
    .ext-link{
      display:inline-flex;align-items:center;gap:8px;
      margin-top:22px;padding:10px 20px;
      border-radius:10px;
      background:var(--accent);color:#fff;
      text-decoration:none;font-size:14px;font-weight:700;
      transition:all 0.2s;
    }
    .ext-link:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:var(--glow);}

    /* ACTIONS */
    .article-actions{
      display:flex;align-items:center;gap:8px;
      padding:16px 30px;
      border-top:1px solid var(--border);
      background:rgba(6,8,16,0.3);
    }
    .act-btn{
      display:flex;align-items:center;gap:5px;
      padding:7px 14px;border-radius:8px;
      background:transparent;border:1px solid var(--border);
      color:var(--text2);cursor:pointer;font-size:13px;
      transition:all 0.15s;font-family:'Tajawal',sans-serif;
    }
    .act-btn:hover{background:rgba(99,102,241,0.1);color:var(--text);border-color:var(--border2);}
    .act-btn.liked{color:#f87171;border-color:rgba(239,68,68,0.3);}

    /* RELATED */
    .related-section{margin-top:28px;}
    .related-title{
      font-size:16px;font-weight:700;color:var(--text);
      margin-bottom:14px;display:flex;align-items:center;gap:8px;
    }
    .related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
    .related-card{
      background:var(--card);border:1px solid var(--border);
      border-radius:12px;overflow:hidden;cursor:pointer;
      transition:all 0.2s;text-decoration:none;
    }
    .related-card:hover{border-color:var(--border2);transform:translateY(-2px);}
    .related-thumb{
      width:100%;height:110px;
      background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(192,132,252,0.1));
      display:flex;align-items:center;justify-content:center;font-size:28px;
    }
    .related-thumb img{width:100%;height:100%;object-fit:cover;}
    .related-info{padding:10px 12px;}
    .related-info h4{font-size:13px;font-weight:700;color:var(--text);line-height:1.4;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .related-info p{font-size:11px;color:var(--text3);margin-top:4px;}

    /* LOADING / ERROR */
    .state-box{
      text-align:center;padding:60px 20px;
      color:var(--text3);font-size:14px;
    }
    .spinner{
      display:inline-block;width:28px;height:28px;
      border:3px solid var(--border2);border-top-color:var(--accent);
      border-radius:50%;animation:spin 0.7s linear infinite;
      margin-bottom:12px;
    }
    @keyframes spin{to{transform:rotate(360deg);}}

    @media(max-width:640px){
      .main-wrap{padding:72px 12px 30px;}
      .article-content{padding:20px 16px;}
      .article-title{font-size:22px;}
      .article-body{font-size:14.5px;}
      .article-actions{padding:12px 16px;}
    }
  </style>
</head>

<nav>

<div class="main-wrap">

    <a href="index.html">🏠 الرئيسية</a>

<script>
const SUPABASE_URL='https://eyqcpkhjzpmawqtilhgl.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cWNwa2hqenBtYXdxdGlsaGdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzODExMDEsImV4cCI6MjA5MDk1NzEwMX0.HKIrJv4o5wwQWwruYnTNu8aRoMTHYuwpOEMQ5XsDcrk';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{persistSession:true,storageKey:'virtux-auth-v2',autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce',storage:window.localStorage}
});

function escapeHtml(str){
  if(!str)return'';
  return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]||m));
}

function getTimeAgo(dateStr){
  if(!dateStr)return'';
  const diff=(Date.now()-new Date(dateStr))/1000;
  if(diff<60)return'الآن';
  if(diff<3600)return'منذ '+Math.floor(diff/60)+' دقيقة';
  if(diff<86400)return'منذ '+Math.floor(diff/3600)+' ساعة';
  return new Date(dateStr).toLocaleDateString('ar-EG');
}

function getTagLabel(tag,room){
  const map={clip:'🎬 كليب',news:'📰 خبر',tourney:'🏆 بطولة',question:'❓ سؤال',review:'⭐ تقييم',screen:'📸 لقطة',live:'🔴 بث',home:'🏠 الرئيسية','gaming-news':'📰 أخبار الألعاب','youtube-news':'▶️ أخبار يوتيوب',highlights:'🎬 أبرز اللحظات',tournaments:'🏆 بطولات'};
  return map[tag]||map[room]||tag||'📄 مقال';
}

async function loadArticle(){
  const urlParams=new URLSearchParams(window.location.search);
  const id=urlParams.get('id');
  if(!id){
    document.getElementById('articleContainer').innerHTML=`<div class="state-box"><div style="font-size:40px">🔍</div><div>لم يتم تحديد مقال</div><a href="index.html" style="color:var(--accent2);margin-top:12px;display:inline-block;">العودة للرئيسية</a></div>`;
    return;
  }
  try{
    const{data,error}=await db.from('posts').select('*').eq('id',id).single();
    if(error)throw error;
    if(!data)throw new Error('المقال غير موجود');

    const p=data;
    document.title='Virtux — '+( p.title||'مقال');
    document.getElementById('breadTag').textContent=getTagLabel(p.tag,p.room);

    // MEDIA
    let mediaHtml='';
    const isVideo=p.url&&(p.url.match(/\.(mp4|webm)$/i)||p.url.includes('/storage/v1/object/public/videos/'));
    const isYT=p.url&&(p.url.includes('youtube.com/watch')||p.url.includes('youtu.be'));
    const isImg=p.url&&(/\.(jpg|jpeg|png|gif|webp|bmp|svg)/i.test(p.url)||(p.tag==='Photo'));

    if(isVideo){
      mediaHtml=`<div class="media-wrap"><video src="${p.url}" controls></video></div>`;
    }else if(isYT){
      const vidMatch=p.url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([^&\?\/]+)/);
      if(vidMatch){
        mediaHtml=`<div class="media-wrap" style="min-height:0;"><iframe src="https://www.youtube.com/embed/${vidMatch[1]}?rel=0" allowfullscreen></iframe></div>`;
      }
    }else if(isImg){
      mediaHtml=`<div class="media-wrap"><img src="${p.url}" alt="${escapeHtml(p.title)}" loading="lazy"></div>`;
    }else if(p.icon&&(p.icon.startsWith('data:')||p.icon.startsWith('http'))){
      mediaHtml=`<div class="media-wrap"><img src="${p.icon}" alt="${escapeHtml(p.title)}" loading="lazy"></div>`;
    }else{
      mediaHtml=`<div class="media-wrap" style="min-height:200px;"><div class="media-emoji">${p.icon||'📄'}</div></div>`;
    }

    // CONTENT
    const bodyText=p.content?escapeHtml(p.content).replace(/\n/g,'<br>'):escapeHtml(p.description||'لا يوجد محتوى.');
    const tagLabel=getTagLabel(p.tag,p.room);
    const timeStr=getTimeAgo(p.created_at);
    const author=p.posted_by||p.user_email||'';

    let extLink='';
    if(p.url&&!isYT&&!isVideo&&!isImg){
      extLink=`<a href="${p.url}" target="_blank" class="ext-link">🔗 رابط إضافي</a>`;
    }

    document.getElementById('articleContainer').innerHTML=`
      <div class="article-card">
        ${mediaHtml}
        <div class="article-content">
          <div class="article-tag">${tagLabel}</div>
          <h1 class="article-title">${escapeHtml(p.title||'بدون عنوان')}</h1>
          <div class="article-meta">
            <span>📅 ${timeStr}</span>
            ${author?`<span>✍️ ${escapeHtml(author)}</span>`:''}
            <span>🏷️ ${escapeHtml(p.room||p.tag||'')}</span>
            <span>❤️ <span id="likeCnt">${p.likes_count||0}</span></span>
          </div>
          <div class="article-body"><p>${bodyText}</p></div>
          ${extLink}
        </div>
        <div class="article-actions">
          <button class="act-btn" id="likeBtn" onclick="toggleLike('${p.id}')">❤️ إعجاب</button>
          <button class="act-btn" onclick="copyLink()">🔗 مشاركة</button>
          <button class="act-btn" onclick="history.back()">← رجوع</button>
        </div>
      </div>`;

    // Load related
    loadRelated(p.room||p.tag, p.id);

  }catch(err){
    document.getElementById('articleContainer').innerHTML=`<div class="state-box"><div style="font-size:40px">⚠️</div><div>${escapeHtml(err.message)}</div><a href="index.html" style="color:var(--accent2);margin-top:12px;display:inline-block;">العودة للرئيسية</a></div>`;
  }
}

async function loadRelated(room, currentId){
  try{
    const{data}=await db.from('posts').select('id,title,icon,url,tag,created_at').eq('room',room).neq('id',currentId).order('created_at',{ascending:false}).limit(4);
    if(!data||!data.length)return;
    const section=document.getElementById('relatedSection');
    const grid=document.getElementById('relatedGrid');
    section.style.display='block';
    grid.innerHTML=data.map(r=>{
      const isImg=r.url&&(/\.(jpg|jpeg|png|gif|webp)/i.test(r.url));
      const isYT=r.url&&(r.url.includes('youtube.com/watch')||r.url.includes('youtu.be'));
      let thumbHtml='';
      if(isImg)thumbHtml=`<img src="${r.url}" alt="" loading="lazy">`;
      else if(isYT){const vid=r.url.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/)?.[1];if(vid)thumbHtml=`<img src="https://img.youtube.com/vi/${vid}/mqdefault.jpg" alt="" loading="lazy">`;}
      else if(r.icon&&(r.icon.startsWith('http')||r.icon.startsWith('data:')))thumbHtml=`<img src="${r.icon}" alt="" loading="lazy">`;
      else thumbHtml=`<span style="font-size:28px">${r.icon||'📄'}</span>`;
      return`<a href="post.html?id=${r.id}" class="related-card">
        <div class="related-thumb">${thumbHtml}</div>
        <div class="related-info">
          <h4>${escapeHtml(r.title||'بدون عنوان')}</h4>
          <p>${getTimeAgo(r.created_at)}</p>
        </div>
      </a>`;
    }).join('');
  }catch(e){}
}

async function toggleLike(id){
  const btn=document.getElementById('likeBtn');
  const cnt=document.getElementById('likeCnt');
  if(!cnt)return;
  const isLiked=btn.classList.contains('liked');
  const current=parseInt(cnt.textContent)||0;
  btn.classList.toggle('liked');
  cnt.textContent=isLiked?current-1:current+1;
  await db.from('posts').update({likes_count:isLiked?current-1:current+1}).eq('id',id).catch(()=>{});
}

function copyLink(){
  navigator.clipboard?.writeText(window.location.href).then(()=>alert('✅ تم نسخ الرابط!')).catch(()=>alert('الرابط: '+window.location.href));
}
